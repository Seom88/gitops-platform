# Immich CNPG Cluster (wave 1) + shared RustFS backups.
# Direct manifests — no library chart. Backup model: single shared bucket
# `cnpg-db-backups` + single key `cnpg-backup` (manual, see docs/rustfs-iam.md),
# per-DB prefix `immich/`. Secret `cnpg-backup-s3-credentials` is namespace-local
# (SOPS: apps/immich/sops/cnpg-backup-credentials.enc.yaml).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # REQUIRED, and it is NOT about recovery.
    #
    # barman-cloud-wal-archive refuses to archive when the destination archive
    # is non-empty ("WAL archive check failed for server <name>: Expected empty
    # archive"). That check is meant to stop a *new* cluster from adopting a
    # stranger's archive, but CNPG also runs it on every instance-manager start
    # of an already-bootstrapped cluster. So the moment this cluster's own
    # archive exists, the next pod recreation kills WAL archiving for good:
    # the check fails, `ContinuousArchiving=False`, and nobody notices while
    # base backups keep reporting success (the check lives only in the WAL
    # path).
    #
    # That is not hypothetical: on 2026-10-05 the pods were recreated, the
    # check failed, WAL stopped being archived and recycled, and the 2Gi PVC
    # hit 100% — which wedged the primary with "Not enough WAL disk space"
    # for two days. This annotation bypasses the check, which is safe here
    # because the archive under immich/ is this cluster's own.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  monitoring:
    enablePodMonitor: true
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName }}
  {{- if .Values.cnpg.enableSuperuserAccess }}
  # Remote access to the `postgres` operator role + creates the
  # `immich-database-superuser` Secret (DR script / manual recovery).
  enableSuperuserAccess: true
  {{- end }}
  # Declarative role management: CNPG reconciles this continuously, so the
  # app role stays a superuser across Cluster recreations — something
  # `bootstrap.initdb.postInitSQL` cannot guarantee (bootstrap SQL runs once).
  #
  # `connectionLimit` and `inherit` are written out ON PURPOSE even though they
  # restate the CNPG CRD defaults (`connectionLimit: -1`, `inherit: true`).
  # Those are structural-schema defaults, so the API server materialises them
  # on every apply. A manifest that omits them never matches the live object and
  # ArgoCD stays OutOfSync forever — with automated selfHeal + ServerSideApply
  # that becomes a sync loop. Do not "clean up" these two lines.
  managed:
    roles:
      - name: {{ .Values.cnpg.owner }}
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: {{ .Values.cnpg.ownerSuperuser }}
  {{- if .Values.backup.enabled }}
  # WAL archiving via the plugin-barman-cloud CNPG-I plugin (ObjectStore
  # immich-backup-store below). Retention lives on the ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup-store
  {{- end }}
  postgresql:
{{ .Values.cnpg.postgresql | toYaml | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
  storage:
    {{- if .Values.cnpg.storage.class }}
    storageClass: {{ .Values.cnpg.storage.class }}
    {{- end }}
    size: {{ .Values.cnpg.storage.size }}
  {{- with .Values.cnpg.inheritedMetadata }}
  inheritedMetadata:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database-{{ .Values.cnpg.database }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: {{ .Values.cnpg.database }}
  owner: {{ .Values.cnpg.owner }}
  cluster:
    name: immich-database
  extensions:
{{ .Values.cnpg.dbExtensions | toYaml | nindent 4 }}

{{- if .Values.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-backup-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  configuration:
    # NO trailing slash: barman joins destinationPath with subpaths and a
    # trailing '/' produces '//' prefixes in ListObjectsV2, which RustFS
    # rejects with InvalidArgument (AWS tolerates it). All existing objects
    # already live under single-slash keys, so keys are unchanged.
    destinationPath: s3://{{ .Values.backup.bucket }}/{{ .Values.backup.prefix }}
    endpointURL: {{ .Values.backup.endpoint }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.secretName }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.backup.secretName }}
        key: SECRET_ACCESS_KEY
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-database-daily
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: immich-database
  schedule: {{ .Values.backup.schedule | quote }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
