apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  annotations:
    # Local wave 1: runs after the backup-init Sync hook (wave 0), so the
    # ObjectStore credentials Secret already exists when WAL archiving starts.
    argocd.argoproj.io/sync-wave: "1"
spec:
  monitoring:
    enablePodMonitor: true
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
{{- if .Values.backup.enabled }}
  # WAL archiving via the plugin-barman-cloud CNPG-I plugin (ObjectStore
  # immich-backup-store, see pg-backup.yaml). No legacy .spec.backup section:
  # retention lives on the ObjectStore (.spec.retentionPolicy).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup-store
{{- end }}

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
    # synchronous:
    #   method: any
    #   number: 1
    
    
  bootstrap:
    initdb:
      database: immich
      owner: immich
  # If you wanna reuse a secret, you can uncomment the following lines and set the name of the secret to use. 
  #     secret:
  #       name: immich-secret

  storage:
    size: 2Gi
