ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# CloudNativePG Barman backups to SeaweedFS S3 (immich-seaweedfs-backups).
# Credentials live in Secret backup.secretName, created at sync time by the
# backup-init hook — never committed to Git.
backup:
  enabled: true
  endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
  region: us-east-1
  bucket: immich-db-backups
  iamUser: immich-backup
  secretName: immich-backup-s3-credentials # pragma: allowlist secret
  # 04:00 UTC daily, matching Longhorn default-daily-backup (retain 3).
  schedule: "0 4 * * *"
  # Recovery-window retention. The plugin CRD only accepts `<n>[dwm]`, so the
  # "3 backup points" policy is expressed as 3d (one backup/day ≈ 3 points).
  retentionPolicy: "3d"

# Naming contract for the cnpg library chart
# (charts/cnpg). All other backup settings stay in `backup`
# above; the library fills image/waves/seaweedfs defaults.
cnpgBackup:
  app: immich
  cluster: immich-database

# Shared CNPG Cluster contract (charts/cnpg cnpg.cluster).
# Single source for instances/image/storage/database/owner; templates render it.
cnpg:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    class: longhorn-cnpg
    size: 2Gi
  database: immich
  owner: immich
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  # Extensions created inside the `immich` database as superuser via the
  # Database CR (the app user is not a superuser). Order: vector first
  # (vchord CASCADEs onto it).
  dbExtensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present

immich:
  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
  server:
    controllers:
      main:
        annotations:
          # Wave 2: this Deployment references the CNPG-generated
          # `immich-database-app` Secret (Cluster is wave 1). Without this,
          # Argo CD validates the Deployment at wave 0 and fails with
          # `secret "immich-database-app" not found`.
          "argocd.argoproj.io/sync-wave": "2"
        # pod:
          # affinity:
          #   podAntiAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       - labelSelector:
          #           matchLabels:
          #             app.kubernetes.io/instance: "{{ .Release.Name }}"
          #             app.kubernetes.io/name: machine-learning
          #             app.kubernetes.io/controller: main
          #         topologyKey: kubernetes.io/hostname
        containers:
          main:
            image: { repository: ghcr.io/immich-app/immich-server, tag: v3.2.2, pullPolicy: IfNotPresent }
            env:
              DB_HOSTNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: host } }
              DB_USERNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: username } }
              DB_PASSWORD: # pragma: allowlist secret
                valueFrom: { secretKeyRef: { name: immich-database-app, key: password } }
              DB_DATABASE_NAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: dbname } }
  machine-learning:
    controllers:
      main:
        containers:
          main:
            image: { repository: ghcr.io/immich-app/immich-machine-learning, tag: v3.2.2, pullPolicy: IfNotPresent }
        # pod:
          # affinity:
          #   podAntiAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       - labelSelector:
          #           matchLabels:
          #             app.kubernetes.io/instance: "{{ .Release.Name }}"
          #             app.kubernetes.io/name: server
          #             app.kubernetes.io/controller: main
          #         topologyKey: kubernetes.io/hostname
  valkey:
    enabled: true

tailscaleIngress:
  immich:
    enabled: true
    hostname: immich
