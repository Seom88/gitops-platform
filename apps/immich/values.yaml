ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# CloudNativePG Barman backups to shared RustFS bucket (cnpg-db-backups).
# Manual model: bucket + key `cnpg-backup` created once in RustFS console
# (see docs/rustfs-iam.md). Same key material lives as a namespace-local
# Secret in every consumer namespace (CNPG ObjectStore requires it local):
# immich/cnpg-backup-s3-credentials (this app) + monitoring/cnpg-backup-s3-credentials.
# No hook, no IAM provisioning from the cluster.
backup:
  enabled: true
  endpoint: https://rustfs.lonk-mirfak.ts.net
  region: us-east-1
  bucket: cnpg-db-backups
  prefix: immich
  secretName: cnpg-backup-s3-credentials # pragma: allowlist secret
  # Tailnet IP of the RustFS host (S3 API :443). FQDN-independent egress
  # fallback (Cilium toCIDR, patrón velero): Cilium solo aprende FQDN->IP
  # observando DNS, así que sin toCIDR el SYN cae si la resolución no pasa
  # por DNS observado.
  # TODO: single-source desde gitops/values.yaml sharedS3.tailnetIp como
  # helm parameter (s3.tailnetIp) igual que gitops/templates/platform/00-velero.yaml;
  # hoy 05-immich.yaml no pasa parameters, así que este literal es la
  # fuente. Si el host RustFS cambia, actualizar ambos.
  tailnetIp: "100.89.39.31"
  # 01:55 UTC daily, ahead of Velero `daily-full` (02:00). Nothing coordinates
  # the two backups, so the gap between them is only safe in one direction:
  # Barman first leaves an orphaned file recoverable on disk; Velero first
  # captures the database row without the file, and the bytes are gone.
  schedule: "55 1 * * *"
  # Recovery-window retention. The plugin CRD only accepts `<n>[dwm]`, so the
  # window is written as 30d — the same 30d Velero keeps, so both layers reach
  # back the same distance on restore.
  retentionPolicy: "30d"

# Shared CNPG Cluster contract (direct manifests in templates/pg-immich.yaml).
# Single source for instances/image/storage/database/owner; templates render it.
cnpg:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    class: longhorn-cnpg
    size: 2Gi
  # Velero opt-out for the CNPG extension image volume. CNPG materialises
  # `postgresql.extensions[].image` as an Image Volume named `ext-<name>`, and
  # the kubelet bind-mounts it straight from the containerd snapshotter overlay.
  # There is no path under /var/lib/kubelet/pods/<uid>/volumes for it, so the
  # Velero node-agent's PodVolumeBackup fails to resolve it on every run
  # (PartiallyFailed). Excluding it by name is the only mechanism that works:
  # resource/volume policies match PVC/PV objects by storageClass or labels, and
  # an image volume has neither.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: ext-vchord
  database: immich
  owner: immich
  # Immich expects a superuser-capable role: on bootstrap it runs
  # `CREATE EXTENSION IF NOT EXISTS <vector ext>` unconditionally (upstream
  # issue #10070) and its in-app DB restore needs it too. This DB is
  # single-tenant, so the app role gets superuser declaratively — which also
  # survives ArgoCD recreating the Cluster. `bootstrap.initdb.postInitSQL`
  # cannot do this: it runs once, at cluster creation only.
  # Trade-off accepted: superuser applies to the Postgres instance, not to
  # "immich" — any pod able to reach the Service with these credentials is
  # superuser. Acceptable for a single-purpose homelab database.
  ownerSuperuser: true
  # Grants remote access to the `postgres` operator role and creates the
  # `immich-database-superuser` Secret. Used by the DR script and manual
  # recovery (see docs/cluster-recovery.md); independent of ownerSuperuser.
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  # Extensions created inside the `immich` database via the Database CR (the
  # operator creates them with its own superuser connection). Order: vector
  # first (vchord CASCADEs onto it).
  dbExtensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present

immich:
  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
  server:
    controllers:
      main:
        annotations:
          # Wave 2: this Deployment references the CNPG-generated
          # `immich-database-app` Secret (Cluster is wave 1). Without this,
          # Argo CD validates the Deployment at wave 0 and fails with
          # `secret "immich-database-app" not found`.
          "argocd.argoproj.io/sync-wave": "2"
        # pod:
          # affinity:
          #   podAntiAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       - labelSelector:
          #           matchLabels:
          #             app.kubernetes.io/instance: "{{ .Release.Name }}"
          #             app.kubernetes.io/name: machine-learning
          #             app.kubernetes.io/controller: main
          #         topologyKey: kubernetes.io/hostname
        containers:
          main:
            image: { repository: ghcr.io/immich-app/immich-server, tag: v3.2.2, pullPolicy: IfNotPresent }
            env:
              DB_HOSTNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: host } }
              DB_USERNAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: username } }
              DB_PASSWORD: # pragma: allowlist secret
                valueFrom: { secretKeyRef: { name: immich-database-app, key: password } }
              DB_DATABASE_NAME:
                valueFrom: { secretKeyRef: { name: immich-database-app, key: dbname } }
  machine-learning:
    controllers:
      main:
        containers:
          main:
            image: { repository: ghcr.io/immich-app/immich-machine-learning, tag: v3.2.2, pullPolicy: IfNotPresent }
        # pod:
          # affinity:
          #   podAntiAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       - labelSelector:
          #           matchLabels:
          #             app.kubernetes.io/instance: "{{ .Release.Name }}"
          #             app.kubernetes.io/name: server
          #             app.kubernetes.io/controller: main
          #         topologyKey: kubernetes.io/hostname
  valkey:
    enabled: true

tailscaleIngress:
  immich:
    enabled: true
    hostname: immich
