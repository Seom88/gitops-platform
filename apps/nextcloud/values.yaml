# Nextcloud on Kubernetes — homelab wiring (Seom88).
# Upstream chart: nextcloud/nextcloud 9.4.0 (appVersion 35.0.1), apache flavor.
# DB: CloudNativePG (initdb; recovery branch templated but gated off) — ADR-022.
# Cache/locking: shared platform/valkey on redis dbindex 1 (ADR-021).
# Exposure: per-app Tailscale Ingress (ADR-018) — templates/tailscale-ingress.yaml.

ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# CloudNativePG Barman backups to the shared RustFS bucket (cnpg-db-backups).
# Same manual model as immich/monitoring (docs/rustfs-iam.md): bucket + key
# `cnpg-backup` created once in the RustFS console, per-DB prefix `nextcloud/`.
# The key material lives as a namespace-local Secret rendered from
# sops/cnpg-backup-credentials.enc.yaml — FILL AND ENCRYPT THAT FILE
# (sops --encrypt --age <recipient from .sops.yaml>) before committing.
backup:
  enabled: true
  endpoint: https://rustfs.lonk-mirfak.ts.net
  region: us-east-1
  bucket: cnpg-db-backups
  prefix: nextcloud
  secretName: cnpg-backup-s3-credentials # pragma: allowlist secret
  # Tailnet IP of the RustFS host (S3 API :443). FQDN-independent egress
  # fallback (Cilium toCIDR, patrón velero) — same literal as immich.
  tailnetIp: "100.89.39.31"
  # 01:55 UTC daily, ahead of Velero `daily-full` (02:00). Barman first leaves
  # an orphaned file recoverable on disk; Velero first would capture the row
  # without the file.
  schedule: "55 1 * * *"
  # Recovery-window retention; 30d matches Velero and the other CNPG clusters.
  retentionPolicy: "30d"

# Patrón 2 — recovery por flag (same as platform/monitoring grafana-database).
# `spec.bootstrap` is WRITE-ONE in CNPG, so a cluster born from initdb can later
# only move to recovery by hand. The branch is templated and gated OFF here:
# when a future restore is needed, flip this to true + set targetTime, and
# ArgoCD recreates the cluster from the barman archive instead of an empty db.
recovery:
  enabled: false
  source: nextcloud-backup-origin
  serverName: nextcloud-database
  targetTime: ""

# Shared CNPG Cluster contract (direct manifests in templates/pg-nextcloud.yaml).
cnpg:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    class: longhorn-cnpg
    size: 3Gi
  database: nextcloud
  owner: nextcloud
  # Nextcloud needs no extensions (immich's vchord/vector) and no remote access
  # to the postgres operator role, so neither managed roles, a Database CR, nor
  # ownerSuperuser are declared: initdb owner is enough on this single-tenant db.
  postgresql:
    # WAL budget — same rationale as immich/grafana: max_wal_size is the hard
    # ceiling that keeps a stalled archiver from filling the volume and wedging
    # the primary ("Not enough WAL disk space").
    parameters:
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

# ─── upstream chart values (dependency name: nextcloud) ───
nextcloud:
  # Digest-pinned. The chart builds the ref as registry/repository:tag with no
  # digest field, so the digest travels inside tag; inline map keeps
  # `just validate-images` happy (no split repository:/tag: lines).
  image: { registry: docker.io, repository: library/nextcloud, tag: 35.0.1-apache@sha256:8f2f0e93aca5e9457019933936dea1f313052e72c696b4aecb31580a208b859f }

  # Wave 2: this Deployment reads the CNPG-generated `nextcloud-database-app`
  # Secret (Cluster at wave 1). Without the delay, ArgoCD applies the Deployment
  # at wave 0 and fails with `secret "nextcloud-database-app" not found`
  # — same fix as immich server / grafana.
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "2"

  # Tailscale terminates TLS at the proxy. Nextcloud must generate https://
  # URLs behind it or the browser gets mixed-content blocks from the app.
  phpClientHttpsFix:
    enabled: true

  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    # Used only as a fallback path: with existingSecret.hostKey set, the chart
    # takes the host from the CNPG secret (key `host`) — same value anyway.
    host: nextcloud-database-rw.nextcloud.svc.cluster.local
    user: nextcloud
    database: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-database-app # pragma: allowlist secret
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname

  nextcloud:
    host: nextcloud.lonk-mirfak.ts.net
    trustedDomains:
      - nextcloud.lonk-mirfak.ts.net
    # Admin credentials come from Secret `nextcloud-admin` (sops-rendered by
    # `just secrets-apply`). FILL AND ENCRYPT sops/nextcloud-admin.enc.yaml
    # before committing.
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: username
      passwordKey: password
    # Redis for cache + file locking. The chart renders redis settings from
    # REDIS_HOST* env only and has no dbindex knob, so the default config is
    # disabled and a custom file pins dbindex 1: immich's Bull queues own db0
    # on the shared valkey (ADR-021). No auth — Cilium restrict who reaches it.
    defaultConfigs:
      redis.config.php: false
    configs:
      redis.config.php: |
        <?php
        $CONFIG = array(
          'memcache.distributed' => '\OC\Memcache\Redis',
          'memcache.locking' => '\OC\Memcache\Redis',
          'redis' => array(
            'host' => 'valkey.valkey.svc.cluster.local',
            'port' => 6379,
            'dbindex' => 1,
            'password' => '',
          ),
        );
    # Lean homelab sizing (ADR-015): single-user Nextcloud idles near zero;
    # limits cap PHP bursts (previews, occ, sync client) on the single node.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 2Gi

  # Background jobs: sidecar /cron.sh (chart default type). A CronJob object
  # would need non-root plus shared RWO access to the data PVC; on a single
  # node the sidecar is the simpler correct choice.
  cronjob:
    enabled: true
    type: sidecar
    sidecar:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # Data (/var/www/html incl. data/). longhorn-encrypted like immich-library:
  # these are personal files. 8Gi to start; Longhorn expands volumes online.
  persistence:
    enabled: true
    storageClass: longhorn-encrypted
    accessMode: ReadWriteOnce
    size: 8Gi

  # Pod port stays 80; the tailscale proxy connects to the Service on 8080
  # (policies use post-DNAT pod ports — same pattern as immich 2283).
  service:
    type: ClusterIP
    port: 8080

  # Ingress is a first-party template (templates/tailscale-ingress.yaml) so the
  # per-app device story (ADR-018) stays in this chart, not in upstream values.
  ingress:
    enabled: false

  # Bitnami subcharts stay disabled: CNPG replaces postgresql/mariadb and
  # platform/valkey replaces redis. They are still downloaded by
  # `helm dependency build` (Chart.yaml lists them) but never rendered.
  redis:
    enabled: false
  postgresql:
    enabled: false
  mariadb:
    enabled: false
  collabora:
    enabled: false

# Per-app Tailscale Ingress (ADR-018). Short hostname: the operator appends
# .lonk-mirfak.ts.net via magicDNS → nextcloud.lonk-mirfak.ts.net
tailscaleIngress:
  nextcloud:
    enabled: true
    hostname: nextcloud
