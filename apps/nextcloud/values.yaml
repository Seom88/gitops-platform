# Nextcloud on Kubernetes — homelab wiring (Seom88).
# Upstream chart: nextcloud/nextcloud 9.4.0 (appVersion 35.0.1), apache flavor.
# DB: CloudNativePG (initdb; recovery branch templated but gated off) — ADR-022.
# Cache/locking: shared platform/valkey on redis dbindex 1 (ADR-021).
# Exposure: per-app Tailscale Ingress (ADR-018) — templates/tailscale-ingress.yaml.

ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# CloudNativePG Barman backups to the shared RustFS bucket (cnpg-db-backups).
# Same manual model as immich/monitoring (docs/rustfs-iam.md): bucket + key
# `cnpg-backup` created once in the RustFS console, per-DB prefix `nextcloud/`.
# The key material lives as a namespace-local Secret rendered from
# sops/cnpg-backup-credentials.enc.yaml — FILL AND ENCRYPT THAT FILE
# (sops --encrypt --age <recipient from .sops.yaml>) before committing.
backup:
  enabled: true
  endpoint: https://rustfs.lonk-mirfak.ts.net
  region: us-east-1
  bucket: cnpg-db-backups
  prefix: nextcloud
  secretName: cnpg-backup-s3-credentials # pragma: allowlist secret
  # Tailnet IP of the RustFS host (S3 API :443). FQDN-independent egress
  # fallback (Cilium toCIDR, patrón velero) — same literal as immich.
  tailnetIp: "100.89.39.31"
  # 01:55 UTC daily, ahead of Velero `daily-full` (02:00). Barman first leaves
  # an orphaned file recoverable on disk; Velero first would capture the row
  # without the file.
  schedule: "55 1 * * *"
  # Recovery-window retention; 30d matches Velero and the other CNPG clusters.
  retentionPolicy: "30d"

# Patrón 2 — recovery por flag (same as platform/monitoring grafana-database).
# `spec.bootstrap` is WRITE-ONE in CNPG, so a cluster born from initdb can later
# only move to recovery by hand. The branch is templated and gated OFF here:
# when a future restore is needed, flip this to true + set targetTime, and
# ArgoCD recreates the cluster from the barman archive instead of an empty db.
recovery:
  enabled: false
  source: nextcloud-backup-origin
  serverName: nextcloud-database
  targetTime: ""

# Shared CNPG Cluster contract (direct manifests in templates/pg-nextcloud.yaml).
cnpg:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    class: longhorn-cnpg
    size: 3Gi
  database: nextcloud
  owner: nextcloud
  # Nextcloud needs no extensions (immich's vchord/vector) and no remote access
  # to the postgres operator role, so neither managed roles, a Database CR, nor
  # ownerSuperuser are declared: initdb owner is enough on this single-tenant db.
  postgresql:
    # WAL budget — same rationale as immich/grafana: max_wal_size is the hard
    # ceiling that keeps a stalled archiver from filling the volume and wedging
    # the primary ("Not enough WAL disk space").
    parameters:
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

# ─── upstream chart values (dependency name: nextcloud) ───
nextcloud:
  # Digest-pinned. The chart builds the ref as registry/repository:tag with no
  # digest field, so the digest travels inside tag; inline map keeps
  # `just validate-images` happy (no split repository:/tag: lines).
  image: { registry: docker.io, repository: library/nextcloud, tag: 35.0.1-apache@sha256:8f2f0e93aca5e9457019933936dea1f313052e72c696b4aecb31580a208b859f }

  # Wave 2: this Deployment reads the CNPG-generated `nextcloud-database-app`
  # Secret (Cluster at wave 1). Without the delay, ArgoCD applies the Deployment
  # at wave 0 and fails with `secret "nextcloud-database-app" not found`
  # — same fix as immich server / grafana.
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "2"

  # Tailscale terminates TLS at the proxy. Nextcloud must generate https://
  # URLs behind it or the browser gets mixed-content blocks from the app.
  phpClientHttpsFix:
    enabled: true

  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    # Used only as a fallback path: with existingSecret.hostKey set, the chart
    # takes the host from the CNPG secret (key `host`) — same value anyway.
    host: nextcloud-database-rw.nextcloud.svc.cluster.local
    user: nextcloud
    database: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-database-app # pragma: allowlist secret
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname

  nextcloud:
    host: nextcloud.lonk-mirfak.ts.net
    trustedDomains:
      - nextcloud.lonk-mirfak.ts.net
    # Admin credentials come from Secret `nextcloud-admin` (sops-rendered by
    # `just secrets-apply`). FILL AND ENCRYPT sops/nextcloud-admin.enc.yaml
    # before committing.
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: username
      passwordKey: password
    # Redis for cache + file locking. The chart renders redis settings from
    # REDIS_HOST* env only and has no dbindex knob, so the default config is
    # disabled and a custom file pins dbindex 1: immich's Bull queues own db0
    # on the shared valkey (ADR-021). No auth — Cilium restrict who reaches it.
    defaultConfigs:
      redis.config.php: false
    configs:
      redis.config.php: |
        <?php
        $CONFIG = array(
          'memcache.distributed' => '\OC\Memcache\Redis',
          'memcache.locking' => '\OC\Memcache\Redis',
          'redis' => array(
            'host' => 'valkey.valkey.svc.cluster.local',
            'port' => 6379,
            'dbindex' => 1,
            'password' => '',
          ),
        );
    # Requests stay small because single-user Nextcloud idles near zero; limits
    # cap PHP bursts (previews, occ, sync client) on the single node. Sizing is
    # evidence-driven — ADR-015 (lean-by-watts) is deprecated since 2026-10-10.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 2Gi

  # Background jobs: sidecar /cron.sh (chart default type). A CronJob object
  # would need non-root plus shared RWO access to the data PVC; on a single
  # node the sidecar is the simpler correct choice.
  cronjob:
    enabled: true
    type: sidecar
    sidecar:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # Data (/var/www/html incl. data/). longhorn-encrypted like immich-library:
  # these are personal files. 8Gi to start; Longhorn expands volumes online.
  persistence:
    enabled: true
    storageClass: longhorn-encrypted
    accessMode: ReadWriteOnce
    size: 8Gi

  # Pod port stays 80; the tailscale proxy connects to the Service on 8080
  # (policies use post-DNAT pod ports — same pattern as immich 2283).
  service:
    type: ClusterIP
    port: 8080

  # Ingress is a first-party template (templates/tailscale-ingress.yaml) so the
  # per-app device story (ADR-018) stays in this chart, not in upstream values.
  ingress:
    enabled: false

  # Bitnami subcharts stay disabled: CNPG replaces postgresql/mariadb and
  # platform/valkey replaces redis. They are still downloaded by
  # `helm dependency build` (Chart.yaml lists them) but never rendered.
  redis:
    enabled: false
  postgresql:
    enabled: false
  mariadb:
    enabled: false
  # Collabora Online (CODE) — ADR-023. The collabora-online subchart ships
  # inside the upstream chart tgz, so enabling it needs no
  # `helm dependency update`. It renders Deployment + Service
  # `nextcloud-collabora` (ClusterIP 9980) and a ConfigMap that injects
  # aliasgroups/server_name/extra_params as coolwsd env vars (envFrom).
  # The Service is `nextcloud-collabora`, not `-collabora-online`: the upstream
  # chart declares the dependency with `alias: collabora`, and Helm rewrites
  # the subchart's Chart.Name to the alias, so the fullname helper builds
  # "<release>-<alias>".
  collabora:
    enabled: true
    # HPA stays off on purpose: the chart README documents that scaling breaks
    # collaborative editing (a document session must stay on one pod). With one
    # replica there is nothing to balance, and per-document affinity hashing
    # belongs to an ingress controller, which the tailscale proxy does not
    # expose. Note the subchart's own default is `true`, so this is pinned.
    autoscaling:
      enabled: false
    # Single-user, single-replica sizing. CODE recommends 2Gi/1800m per pod for
    # an HA footprint; these limits cap one editing session on this node inside
    # the memory it currently has free (ADR-019).
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 2Gi
    # URL this Nextcloud instance advertises for the Collabora server, wired by
    # templates/collabora-occ-job.yaml. It must be the EXTERNAL https hostname:
    # the office/richdocuments app puts it in the iframe the browser loads and
    # in the discovery document it caches, so an in-cluster Service name here
    # sends the browser somewhere it cannot resolve. This value and coolwsd's
    # `server_name` below describe the same host and change together.
    wopiUrl: https://collabora.lonk-mirfak.ts.net
    collabora:
      # The editor iframe is served by coolwsd, so CODE has to be reachable on
      # its own tailnet hostname (second Ingress below) — never through
      # Nextcloud's. This is the host coolwsd advertises in its discovery
      # document. :443 stays in the value because the tailscale proxy
      # terminates TLS and forwards plain HTTP to the pod on :9980.
      server_name: collabora.lonk-mirfak.ts.net:443
      # The integrator (WOPI host) Collabora accepts: the Nextcloud URL exactly
      # as the browser sees it. coolwsd validates the Origin of every editor
      # request against this list, so one entry is required per host that can
      # serve Nextcloud.
      aliasgroups:
        - host: "https://nextcloud.lonk-mirfak.ts.net:443"
      # TLS terminates at the tailscale proxy, which forwards plain HTTP and
      # sets X-Forwarded-Proto: https (tailscale/tailscale#8224, >=1.44).
      # ssl.termination=true makes coolwsd emit https URLs in the discovery
      # document — which is what the richdocuments/office app hands the
      # browser. Leaving it out makes the discovery document self-describe as
      # http and the browser blocks a mixed-content iframe on an https page.
      # net.post_allow needs no entry: the pod CIDR (10.42.0.0/16) is already
      # inside CODE's default allowlist (10.0.0.0/8), so the WOPI POSTs back to
      # Nextcloud pass without widening the list.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true

# Per-app Tailscale Ingress (ADR-018). Short hostname: the operator appends
# .lonk-mirfak.ts.net via magicDNS → nextcloud.lonk-mirfak.ts.net
# `service`/`port` default to the entry name and 8080, which is exactly the
# upstream chart's Service `nextcloud`, so only the Collabora entry spells
# them out. One proxy StatefulSet is created per entry.
tailscaleIngress:
  nextcloud:
    enabled: true
    hostname: nextcloud
  # CODE cannot ride Nextcloud's Ingress: coolwsd serves the editor iframe
  # itself, so the browser must reach it on its own hostname. The upstream
  # chart declares the dependency with `alias: collabora`, so Helm names the
  # rendered Service after the alias — `nextcloud-collabora`, ClusterIP on
  # 9980: the only object in this namespace that is neither named like the
  # entry nor listening on 8080.
  collabora:
    enabled: true
    hostname: collabora
    service: nextcloud-collabora
    port: 9980
