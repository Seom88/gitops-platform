# Digest-pinned (fail-closed Trivy gate): refresh with
# skopeo inspect docker://ghcr.io/gethomepage/homepage:<tag> | jq -r .Digest
# Tag stays for Renovate (docker datasource bumps tag+digest together).
image: "ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f"

ciliumNetworkPolicy:
  enabled: true

developmentApp:
  enabled: false

# Tailnet domain suffix for homepage dashboard links (dev adds -dev via values-dev.yaml)
myDomain: .lonk-mirfak.ts.net

vault:
  enabled: false

# Per-app Tailscale Ingress (moved from platform/ts-ingress, ADR-018)
tailscaleIngress:
  homepage:
    enabled: true
    hostname: homepage
