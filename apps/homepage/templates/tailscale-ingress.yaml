{{- if .Values.tailscaleIngress.homepage.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
  - hosts:
    - {{ .Values.tailscaleIngress.homepage.hostname }}
{{- end }}
