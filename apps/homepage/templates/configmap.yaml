apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/Seom88
              icon: github
              description: My repositories, stars and code
        - Mend:
            - abbr: MD
              href: https://developer.mend.io/
              description: Renovate updates for charts and images
  services.yaml: |
    - GitOps & Security:
        - Argo CD:
            icon: argo-cd
            href: https://argocd{{ .Values.myDomain }}/
            description: GitOps deployments, sync status and app history
        {{- if .Values.vault.enabled }}
        - Vault:
            icon: vault
            href: https://vault{{ .Values.myDomain }}
            description: Secrets, tokens and encryption key management
        {{- end }}
    - Observability:
        - Grafana:
            icon: grafana
            href: https://grafana{{ .Values.myDomain }}/
            description: Dashboards for metrics, logs and cluster health
        - Prometheus:
            icon: prometheus
            href: https://prometheus{{ .Values.myDomain }}/
            description: Metrics collection, queries and alert rules
        - Hubble:
            icon: cilium
            href: https://hubble{{ .Values.myDomain }}/
            description: Network flows, service map and policy visibility
    - Storage:
        - Longhorn:
            icon: longhorn
            href: https://longhorn{{ .Values.myDomain }}/
            description: Block storage, volumes, snapshots and backups
        - SeaweedFS Admin:
            icon: sh-seaweedfs
            href: https://seaweedfs-admin{{ .Values.myDomain }}/
            description: S3 object storage, buckets, volumes and filer
        - RustFS Console:
            icon: rustfs
            href: https://rustfs.lonk-mirfak.ts.net:8443/
            description: S3-compatible storage, buckets, access keys and console
    - Media:
        - Immich:
            icon: immich
            href: https://immich{{ .Values.myDomain }}/
            description: Photo backup, albums, sharing and mobile sync
        - Nextcloud:
            icon: nextcloud
            href: https://nextcloud{{ .Values.myDomain }}/
            description: Files, calendar, contacts and office sync
    - Infrastructure:
        - AlmaLinux:
            icon: si-almalinux
            description: Bare-metal node aleph, AlmaLinux 10.
        - TrueNAS:
            icon: truenas-scale
            href: https://truenas-scale.lonk-mirfak.ts.net/
            description: NAS pools, datasets, shares, snapshots and backups
        - Portainer:
            icon: portainer
            href: https://truenas-scale.lonk-mirfak.ts.net:9443/
            description: Containers, stacks, images and endpoint management
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  # NOT a Proxmox integration (see services.yaml: bare-metal since 5fb2315).
  # Empty placeholder required by homepage v2's config migration: on startup it
  # copies any /app/src/skeleton/*.yaml missing from /app/config into it. Under
  # runAsNonRoot: true, /app/config is root:root and that copy fails EACCES,
  # exiting 1. So every skeleton file must exist here, even when empty.
  proxmox.yaml: ""
