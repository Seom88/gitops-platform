# CI — validation only (lint/render/scan gates). Security Trivy scans live in
# security.yaml so a CVE finding never flips the CI badge; the badge reflects
# whether the repo is well-formed, not whether upstream images have CVEs.
# Shared shell logic is centralized in scripts/ — this workflow and the
# justfile are both thin callers of the same scripts (workflows are the
# source of truth; justfile is a local mirror).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.2

jobs:
  validate:
    concurrency:
      group: ci-validate-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Secret scan (detect-secrets, baseline-gated)
        run: |  # pragma: allowlist secret -- `detect-secrets==` pin below trips KeywordDetector; not a secret
          python3 -m pip install --quiet detect-secrets==1.5.0
          # Fails on NEW secrets vs .secrets.baseline; never auto-updates it.
          # To accept a finding: `detect-secrets audit .secrets.baseline` locally.
          # SOPS ciphertext (*.enc.yaml) and public age keys (.sops.yaml) are excluded:
          # ciphertext is safe-by-design and churns on every re-encryption
          # (hash-baselining it would break CI on each rotation); .sops.yaml holds
          # only public recipient keys. Templated placeholder field names stay scanned
          # via the baseline.
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --exclude-files '\.enc\.yaml$|\.sops\.yaml$'

      - name: Setup Helm (${{ env.HELM_VERSION }})
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint & render gitops chart (prod/dev)
        run: ./scripts/lint-gitops.sh

      - name: Lint platform + shared library charts
        run: ./scripts/lint-charts.sh platform/*/ charts/*/

      - name: ShellCheck scripts
        env:
          SCRIPTS_STRICT: "1"
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "Installing shellcheck..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          ./scripts/shellcheck-check.sh

      - name: YAML sanity + yamllint (yamllint is non-blocking inside the script)
        run: ./scripts/check-yaml.sh

      - name: Inline image convention (no split repository/tag in values)
        run: ./scripts/check-inline-images.sh

      - name: Kepler Cilium policy completeness (ADR-014)
        run: ./scripts/check-kepler-policy.sh

      - name: JSON sanity (python -m json.tool)
        run: ./scripts/check-json.sh
