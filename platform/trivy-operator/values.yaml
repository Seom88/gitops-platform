# Trivy Operator — in-cluster vulnerability/config scanning.
# Reports + metrics only: the admission webhook stays disabled (upstream
# default), so nothing blocks deploys. Complements the CI Trivy scans in
# .github/workflows/security.yaml and `just scan`.
#
# Wrapper note: upstream keys live under the dependency name
# (`trivy-operator`), so the official `trivy.ignoreUnfixed` setting becomes
# `trivy-operator.trivy.ignoreUnfixed` here. A top-level `trivy:` key would
# be dead values — Helm only forwards the subchart-name subtree.
ciliumNetworkPolicy:
  enabled: true

trivy-operator:
  # Skip DaemonSet-heavy namespaces (e.g. 6-container Cilium agents) to avoid scan lock-contention.
  # NOTE: subchart-top-level key (sibling of `operator:`/`trivy:`), NOT `operator.excludeNamespaces`.
  excludeNamespaces: "kube-system,monitoring"
  operator:
    scanJobsConcurrentLimit: 2
    scanJobTimeout: 15m
    # Weekly rescan instead of the 24h upstream default: scan Jobs churn
    # endpoints/volumes/cgroups on this single node (observed cilium-agent
    # >100% CPU during scan storms). CI already scans every push.
    scannerReportTTL: "168h"
    # Disabled: node-collector needs a mutable host rootfs, which immutable host OS layouts break.
    infraAssessmentScannerEnabled: false
    # Built-in server caches trivy-db (113MiB) on a Longhorn PVC so every
    # scan Job uses ClientServer mode instead of re-downloading from mirror.gcr.io.
    # Eliminates per-Job EOF flakes and rate-limit pressure on small nodes.
    builtInTrivyServer: true
  trivy:
    # Show only vulnerabilities with a known fix (same policy as
    # CI `--ignore-unfixed`: cuts unactionable noise).
    ignoreUnfixed: true
    slow: true
    timeout: 10m
    # Cache persistence for builtInTrivyServer — Longhorn PVC (5Gi conservative
    # for limited resources) holds DB across Job restarts.
    storageClassName: longhorn
    storageSize: 5Gi
    storageClassEnabled: true
    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 2Gi
    resources:
      requests:
        # Explicit requests/limits prevent 0-storage scheduling and
        # kubelet ephemeral-storage eviction on small nodes.
        cpu: 100m
        memory: 256Mi
        ephemeralStorage: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
        ephemeralStorage: 3Gi
