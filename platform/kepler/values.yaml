# Kepler wrapper — subchart overrides only.
#
# Purpose: per-node and per-pod watts from RAPL (CPU cores + DRAM + iGPU+uncore),
# exported as Prometheus metrics for the solar-energy programme (ADR-025).
#
# SCOPE (ADR-025): this is measurement-only. RAPL does NOT cover physical
# disks, fans, PSU conversion loss, or anything outside the node (inverter,
# network gear) — those need host/infra-side measurements. Kepler is the
# in-cluster evidence layer required by ADR-019's "sizing is evidence-driven"
# clause; it does not enforce or schedule anything.

# Wrapper-level (not affected by subchart nesting): CiliumNetworkPolicies for
# the kepler namespace, mirroring the monitoring umbrella's pattern. Grafana
# dashboards can scrape metrics only via the Prometheus endpoints.
ciliumNetworkPolicy:
  enabled: true

# All overrides below nest under `kepler` — the vendored subchart dependency
# (wrapper-level keys only map to subcharts when they match the dependency's
# `name`, not their own chart-named keys).
kepler:
  # Deployed by ArgoCD into namespace `kepler`
  # (gitops/templates/platform/03-kepler.yaml with CreateNamespace=true), so
  # the upstream namespace template must not double-create it.
  namespace:
    create: false
    name: kepler

  config:
    log:
      # Upstream default is debug — far too chatty for a 24/7 node that must
      # spend its watt budget on workload, not logging.
      level: info
    monitor:
      # Power computation is CPU-bound and at the upstream 5s default it
      # cannot keep up on this node: /metrics takes 10-45s and exceeds both
      # Prometheus' 10s scrape timeout and the kubelet's readiness checks.
      # Match the 30s ServiceMonitor interval instead.
      interval: 60s
    exporter:
      prometheus:
        # Default is all five levels (node,process,container,vm,pod). Process
        # and VM scanning dominates the collection cost, and ADR-025 only
        # needs node + pod watts (container kept for per-workload drill-down).
        metricsLevel: [node, container, pod]
    kube:
      # Pod/namespace attribution so Grafana can rank consumers — but enabled
      # via the daemonset's --kube.enable / --kube.node-name=$(NODE_NAME) args,
      # NOT here. In kepler v0.12 the config file is validated at load time,
      # BEFORE CLI flags are merged, so `enabled: true` + empty `nodeName` in
      # the file fails validation and kepler exits (the flag supplies
      # nodeName at runtime). The hostname fallback only applies when kube is
      # disabled, so a static nodeName here can't work for a daemonset either.
      # Keep config-side knobs (podInformer) below; enabled stays `false`.
      enabled: false
      podInformer:
        mode: kubelet
        # Poll less often than the 15s default: a single-node cluster has one
        # target and the informer only feeds static attribution metadata.
        pollInterval: 30s

  serviceMonitor:
    # Disabled in favor of the monitoring umbrella's own ServiceMonitor
    # (templates/services/kepler-servicemonitor.yaml, same pattern as its
    # velero one): the vendored template has no scrapeTimeout knob, forcing
    # Prometheus' 10s global default against a collection that runs
    # 8.6-10s on this node — ~31% of scrapes time out and leave dashboards
    # with 1-2 min gaps. The umbrella monitor keeps the 60s interval and
    # raises scrapeTimeout to 30s.
    enabled: false

  daemonset:
    # Kepler itself must be a negligible consumer: it exists to measure, and
    # its own footprint must stay bounded on a solar-budget node.
    # Sizing measured via cadvisor over 3h without limits: CPU avg 0.18-0.32
    # cores, 1m peak 0.51 cores; memory peak 133MiB (restart overlap), steady
    # ~86MiB. Requests reflect steady demand; limits keep ~2x headroom so the
    # collection bursts are not CFS-throttled while a runaway stays capped.
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 256Mi
