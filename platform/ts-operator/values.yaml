developmentApp:
  enabled: false

ciliumNetworkPolicy:
  enabled: true

# tailscale-operator subchart values — wave -1 healthy gate
# Secret tailscale/operator-oauth is created externally via `just secrets-apply`
# and bootstrap/init-gitops.sh (no CI involvement — GitOps pull-only cluster)
#   keys: client_id + client_secret (matches spec oauthSecretName: operator-oauth, secretKeyRef)
# The chart mounts the pre-created Secret `operator-oauth` by default when oauth.clientId/clientSecret are unset.
tailscale-operator:
  # oauthSecretName: operator-oauth  # implicit default — chart mounts Secret `operator-oauth` when oauth.* is empty
  oauth:
    clientId: ""
    clientSecret: ""
  operatorConfig:
    # Device/MagicDNS name of the operator (also the API server proxy URL for
    # `tailscale configure kubeconfig` — auth mode impersonates the caller's
    # Tailscale identity; RBAC via templates/users/clusterrolebinding-tailnet-admins.yaml).
    # Naming scheme: googology — nodes = aleph-* (cardinals), this gate = beth (ℶ).
    hostname: "beth"
    defaultTags:
      - "tag:k8s-operator"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  apiServerProxyConfig:
    mode: "true"
  proxyConfig:
    defaultTags: "tag:k8s"
    # Cluster-wide default ProxyClass for Ingress/Service proxies
    # (templates/proxyclass.yaml). Supported by subchart 1.102.4 via
    # PROXY_DEFAULT_CLASS env — no per-Ingress labels needed.
    defaultProxyClass: "prod-proxies"

# Orphan-app Tailscale Ingresses (moved from platform/ts-ingress, ADR-018):
# argocd + hubble-ui Apps are not declared here, so their Ingresses ship here
tailscaleIngress:
  argocd:
    enabled: true
    hostname: argocd
  hubbleUi:
    enabled: true
    hostname: hubble
