developmentApp:
  enabled: false

ciliumNetworkPolicy:
  enabled: true

# Shared S3 egress — single source for the URL: gitops/values.yaml
# sharedS3.tailnetFqdn (literal) -> gitops/templates/platform/-1-ts-operator.yaml
# helm.parameter s3.tailnetFqdn -> here.
# tailnetFqdn is REQUIRED (empty on purpose — NO fallback literal:
# a stale default would point to no RustFS, so the shared s3-egress Service
# fails loudly via `required`).
# Do NOT put a URL literal here.
s3:
  tailnetFqdn: ""

# tailscale-operator subchart values — wave -1 healthy gate
# Secret tailscale/operator-oauth is created externally via CI (deploy.yaml) and bootstrap/init-gitops.sh
#   keys: client_id + client_secret (matches spec oauthSecretName: operator-oauth, secretKeyRef)
# The chart mounts the pre-created Secret `operator-oauth` by default when oauth.clientId/clientSecret are unset.
tailscale-operator:
  # oauthSecretName: operator-oauth  # implicit default — chart mounts Secret `operator-oauth` when oauth.* is empty
  oauth:
    clientId: ""
    clientSecret: ""
  operatorConfig:
    hostname: "tailscale-operator"
    defaultTags:
      - "tag:k8s-operator"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  proxyConfig:
    defaultTags: "tag:k8s"

# Orphan-app Tailscale Ingresses (moved from platform/ts-ingress, ADR-018):
# argocd + hubble-ui Apps are not declared here, so their Ingresses ship here
tailscaleIngress:
  argocd:
    enabled: true
    hostname: argocd
  hubbleUi:
    enabled: true
    hostname: hubble
