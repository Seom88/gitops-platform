developmentApp:
  enabled: true

# dev overrides — hostnames for the orphan-app Ingresses in templates/infra/
tailscale-operator:
  operatorConfig:
    hostname: "beth-dev"
    defaultTags:
      - "tag:k8s-operator"
  proxyConfig:
    defaultTags: "tag:k8s"
    # Same default as values.yaml — stated explicitly so the dev overlay
    # never drifts if its proxyConfig block grows.
    defaultProxyClass: "prod-proxies"

tailscaleIngress:
  argocd:
    hostname: argocd-dev
  hubbleUi:
    hostname: hubble-dev
