{{- if .Values.tailscaleIngress.hubbleUi.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
  tls:
  - hosts:
    - {{ .Values.tailscaleIngress.hubbleUi.hostname }}
{{- end }}
