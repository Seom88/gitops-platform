{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for tailscale namespace — operator + Ingress proxies
# ADR-014: Cilium v1.20.1 kubeProxyReplacement=strict enforces identity; Flannel ignored mismatches.

# 1) DNS
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-dns
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # k3s hardening: ClusterIP (10.43.0.10) via kube-proxy iptables path —
    # toEndpoints alone does not cover it when kube-proxy is still alive
    # alongside Cilium strict. L4-only, no L7 dns rule here.
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# 2) Egress — kube-apiserver + Tailscale control plane (443) + DNS + webhook to kubelets
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-egress
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    # Intra-namespace allow-all: operator, proxies y nameserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Tailscale direct (WireGuard hole-punching) — peers use ephemeral high UDP ports (e.g. 59652, 1041)
    # + STUN 3478/udp + DERP 443/tcp + 41641/udp. Cilium >=1.11 supports endPort for UDP range:
    # world UDP 1-65535 covers all ephemeral (1041 <1024, 59652, 1900 SSDP/5351 mDNS) while keeping TCP narrow (80/443 only).
    # World UDP range now covers 1900/5351; host block below kept for reference. Do NOT add broad TCP range or bare world without toPorts.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "1"
              endPort: 65535
              protocol: UDP
    # ICMP Echo for Tailscale PMTU — CRD 1.33.11 requires icmps[].fields[].type (bare family is invalid)
    - toEntities:
        - world
      icmps:
      - fields:
        - family: IPv4
          type: 8
        - family: IPv4
          type: 0
        - family: IPv6
          type: 128
        - family: IPv6
          type: 129
    - toFQDNs:
        - matchName: controlplane.tailscale.com
        - matchPattern: "*.controlplane.tailscale.com"
        - matchPattern: "*.tailscale.com"
        - matchPattern: "*.ts.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "41641"
              protocol: UDP
    # Proxies forward to in-cluster services (operator creates Service per Ingress) — allow to cluster
    # Vault 8200 (Vault API) + 9090 (metrics) only; 80/443 removed — operators proxy to pod ports, not Service ports post-DNAT
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # mDNS/SSDP host discovery — host entity (10.244.0.131:5351, 239.255.255.250:1900) not covered by world UDP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5351"
              protocol: UDP
            - port: "1900"
              protocol: UDP
    # Hubble
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
# 3) Ingress — API server webhook + host probes + hubble
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-allow-ingress
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
{{- end }}
---
# Tailscale ingress proxies -> backend pods (moved from platform/ts-ingress, ADR-018):
# the operator spawns one proxy StatefulSet per Ingress in the tailscale namespace
# (label tailscale.com/managed=true). Proxies only get kube-apiserver/world from
# allow-egress above; without this rule proxy->backend cross-namespace traffic
# (pod IPs, not Service ClusterIPs) is DROPPED. Ports are backend POD ports
# (Cilium matches post-DNAT pod ports, not Service ports).
{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ts-operator-proxy-egress
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      k8s:tailscale.com/managed: "true"
  egress:
    # Self-sufficient DNS + apiserver: proxies must not depend on union
    # with the namespace-wide policies to resolve kubernetes.default.svc.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
            - port: "23646"
              protocol: TCP
            - port: "33646"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
{{- end }}
