{{- if .Values.nameserverWatchdog.enabled }}
# RBAC for the k8s-nameserver crashloop watchdog (script ConfigMap + CronJob
# in templates/nameserver-watchdog.yaml). Narrow by construction:
# - Role touches ONLY pods in the tailscale namespace with get (read status),
#   list (find crashlooping nameserver pods) and delete (force immediate
#   recreation with kubelet backoff reset). No other resources, no other
#   namespaces, no scale, no exec.
# - delete cannot be scoped via resourceNames: the operator generates
#   nameserver pod names with random suffixes, so exact names are unknowable
#   at render time. The script compensates by deleting ONLY pods whose name
#   contains "nameserver" AND whose status is waiting CrashLoopBackOff AND
#   whose restartCount >= MIN_RESTARTS (see the script header).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nameserver-watchdog
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nameserver-watchdog
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nameserver-watchdog
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: nameserver-watchdog
    namespace: tailscale
roleRef:
  kind: Role
  name: nameserver-watchdog
  apiGroup: rbac.authorization.k8s.io
{{- end }}
