# ts.net CoreDNS reconciler — Sync-hook Job (first-convergence gate) +
# CronJob (drift reconciler) sharing one idempotent script. Reads the
# nameserver ClusterIP from DNSConfig/status at runtime (never a hardcoded
# IP) and keeps exactly one marker-delimited `ts.net:53` sibling block before
# the catch-all `.:53` in kube-system/coredns. Safe to reapply: converged
# state exits 0 without touching the ConfigMap; IP rotation converges on the
# next run without manifest edits. Never creates the ConfigMap and never
# rewrites unrelated Corefile content — a missing ConfigMap/Corefile/`.:53`
# fails loudly. Writes are field-scoped JSONPatches touching only
# data.Corefile, guarded by a resourceVersion `test` precondition and issued
# inside a bounded read-modify-write retry loop (fresh read + rebuild on
# every attempt; loud failure after exhaustion). After a successful write the
# script attempts a narrowly scoped rollout restart of deployment/coredns and
# falls back explicitly to the CoreDNS `reload` plugin (default in kubeadm
# Corefiles) when the restart is unavailable.
# Ordering: the Job is an ArgoCD Sync hook at wave "-1" (BeforeHookCreation
# + Replace so every sync re-runs the gate instead of colliding with the
# previous run); the CronJob stays an ordinary wave "-1" resource (NOT a
# hook) healing IP rotation and out-of-band Corefile replacement every 5m.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-tsnet-patch-script
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  patch-coredns-tsnet.sh: |
    #!/bin/sh
    # Reconcile the managed ts.net:53 stub in kube-system/coredns.
    # Env: DNSCONFIG_NAME (default ts-dns), WAIT_SECS (default 120),
    # POLL_INTERVAL (default 5). Idempotent: exit 0 when converged.
    set -eu
    DNSCONFIG="${DNSCONFIG_NAME:-ts-dns}"
    WAIT_SECS="${WAIT_SECS:-120}"
    POLL_INTERVAL="${POLL_INTERVAL:-5}"
    BEGIN_MARK="# managed by coredns-tsnet-patch: begin"
    END_MARK="# managed by coredns-tsnet-patch: end"

    echo "[tsnet-patch] waiting for dnsconfig/$DNSCONFIG status.nameserver.ip (max ${WAIT_SECS}s)..."
    NS_IP=""
    ELAPSED=0
    N=0
    while [ "$ELAPSED" -lt "$WAIT_SECS" ]; do
      NS_IP="$(kubectl get dnsconfig "$DNSCONFIG" -o 'jsonpath={.status.nameserver.ip}' 2>/dev/null || true)"
      if [ -n "$NS_IP" ]; then
        echo "[tsnet-patch] nameserver IP: $NS_IP"
        break
      fi
      N=$((N + 1))
      if [ $((N % 6)) -eq 0 ]; then
        echo "[tsnet-patch] status empty ($ELAPSED/$WAIT_SECS s)..."
      fi
      sleep "$POLL_INTERVAL"
      ELAPSED=$((ELAPSED + POLL_INTERVAL))
    done
    if [ -z "$NS_IP" ]; then
      echo "[tsnet-patch] ERROR: dnsconfig/$DNSCONFIG status.nameserver.ip empty after ${WAIT_SECS}s" >&2
      kubectl get dnsconfig "$DNSCONFIG" -o yaml 2>/dev/null || true
      exit 1
    fi
    # Allowlist validation: IP literals only (IPv4 dotted or IPv6), no
    # whitespace or shell metacharacters — the value lands in a Corefile.
    case "$NS_IP" in
      "" | *[!0-9a-fA-F.:]*)
        echo "[tsnet-patch] ERROR: refusing non-IP nameserver value: $NS_IP" >&2
        exit 1
        ;;
    esac
    case "$NS_IP" in
      *.* | *:*) ;;
      *)
        echo "[tsnet-patch] ERROR: refusing non-IP nameserver value: $NS_IP" >&2
        exit 1
        ;;
    esac

    TMPDIR_WORK="$(mktemp -d)"
    COREFILE="$TMPDIR_WORK/Corefile.current"
    PATCHED_CORE="$TMPDIR_WORK/Corefile.patched"

    fetch_current() {
      # Fresh read on EVERY retry attempt: current Corefile plus the
      # resourceVersion that guards the field-scoped write below.
      if ! kubectl get configmap coredns -n kube-system -o 'jsonpath={.data.Corefile}' > "$COREFILE" 2>/dev/null; then
        echo "[tsnet-patch] ERROR: cannot read kube-system/coredns .data.Corefile (missing ConfigMap? RBAC?)" >&2
        return 1
      fi
      if [ ! -s "$COREFILE" ]; then
        echo "[tsnet-patch] ERROR: kube-system/coredns .data.Corefile is empty — refusing to rewrite" >&2
        return 1
      fi
      if ! RV="$(kubectl get configmap coredns -n kube-system -o 'jsonpath={.metadata.resourceVersion}' 2>/dev/null)"; then
        echo "[tsnet-patch] ERROR: cannot read kube-system/coredns resourceVersion (RBAC?)" >&2
        return 1
      fi
      if [ -z "$RV" ]; then
        echo "[tsnet-patch] ERROR: kube-system/coredns resourceVersion is empty — refusing to write unguarded" >&2
        return 1
      fi
      return 0
    }

    build_patched() {
      fetch_current || return 1
      # Pass 1: drop any previous managed block and any legacy marker-less
      # top-level ts.net block (leftover from the removed coredns-patch chart
      # era), then insert a fresh managed block before .:53.
      # Blank-line discipline (convergence requirement): blanks around the
      # insertion point are normalized to exactly one trailing blank, other
      # blanks pass through verbatim — otherwise every run would append a
      # blank and never converge byte-identical.
      if ! NS_IP="$NS_IP" BEGIN_MARK="$BEGIN_MARK" END_MARK="$END_MARK" awk '
        BEGIN { in_man = 0; inserted = 0; skip = 0; brace = 0; held = 0 }
        {
          s = $0
          sub(/^[ \t]+/, "", s)
          if (skip == 1) {
            t1 = s; opens = gsub(/\{/, "{", t1)
            t2 = s; closes = gsub(/\}/, "}", t2)
            brace += opens - closes
            if (brace <= 0) skip = 0
            next
          }
          # Marker match is prefix-based: the begin line carries a human
          # suffix ("(DNSConfig ts-dns - do not edit)") written by this same
          # script, so exact equality would never strip our own block back.
          if (index(s, ENVIRON["BEGIN_MARK"]) == 1) { in_man = 1; next }
          if (index(s, ENVIRON["END_MARK"]) == 1) { in_man = 0; next }
          if (in_man) next
          if ($0 ~ /^ts\.net:53[ \t]*\{/) { skip = 1; brace = 1; next }
          if (s ~ /^[ \t]*$/) { held++; next }
          if (!inserted && s ~ /^\.:53[ \t]*\{/) {
            held = 0
            print ENVIRON["BEGIN_MARK"] " (DNSConfig ts-dns - do not edit)"
            print "ts.net:53 {"
            print "    errors"
            print "    cache 30"
            print "    forward . " ENVIRON["NS_IP"]
            print "}"
            print ENVIRON["END_MARK"]
            print ""
            inserted = 1
            print
            next
          }
          while (held > 0) { print ""; held-- }
          print
        }
        END {
          while (held > 0) { print ""; held-- }
          if (!inserted) { print "ERROR: no .:53 server block found - refusing to modify Corefile" > "/dev/stderr"; exit 1 }
        }
      ' "$COREFILE" > "$PATCHED_CORE"; then
        return 1
      fi
      # Behavior guards on the transformed Corefile (before touching the cluster).
      TS_LINE="$(grep -nF 'ts.net:53' "$PATCHED_CORE" | head -1 | cut -d: -f1)"
      DOT_LINE="$(grep -nE '^\.:53[[:space:]]*\{' "$PATCHED_CORE" | head -1 | cut -d: -f1)"
      if [ -z "$TS_LINE" ] || [ -z "$DOT_LINE" ] || [ "$TS_LINE" -ge "$DOT_LINE" ]; then
        echo "[tsnet-patch] ERROR: transformed Corefile fails sibling-order guard" >&2
        return 1
      fi
      if ! grep -qF "forward . $NS_IP" "$PATCHED_CORE"; then
        echo "[tsnet-patch] ERROR: transformed Corefile missing forward IP" >&2
        return 1
      fi
      if cmp -s "$COREFILE" "$PATCHED_CORE"; then
        echo "[tsnet-patch] converged: ts.net:53 already forwards to $NS_IP before .:53"
        return 2
      fi
      return 0
    }

    json_escape() {
      # JSON-escape stdin into a single-line string (no surrounding quotes).
      # Handles backslash, double-quote, TAB, and LF — the only special bytes
      # a Corefile can realistically carry. Anything else exotic fails loudly
      # at the kubectl patch step instead of corrupting the Corefile.
      awk '
        {
          gsub(/\\/, "\\\\")
          gsub(/"/, "\\\"")
          gsub(/\t/, "\\t")
          if (NR > 1) printf "\\n"
          printf "%s", $0
        }
      '
    }

    write_patch() {
      # Field-scoped write: only /data/Corefile changes, so unrelated
      # ConfigMap keys/data can never be clobbered. The `test` op on
      # resourceVersion makes the write fail (409/422) when the ConfigMap
      # changed under us, so the retry loop rebuilds from a fresh read.
      ESCAPED="$(json_escape < "$PATCHED_CORE")" || {
        echo "[tsnet-patch] ERROR: failed to JSON-encode the patched Corefile" >&2
        return 1
      }
      PATCH_JSON='[{"op":"test","path":"/metadata/resourceVersion","value":"'"$RV"'"}'
      PATCH_JSON="$PATCH_JSON"',{"op":"replace","path":"/data/Corefile","value":"'"$ESCAPED"'"}]'
      kubectl patch configmap coredns -n kube-system --type=json -p "$PATCH_JSON"
    }

    MAX_ATTEMPTS="${MAX_ATTEMPTS:-3}"
    RETRY_SLEEP="${RETRY_SLEEP:-5}"
    ATTEMPT=0
    while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
      ATTEMPT=$((ATTEMPT + 1))
      if build_patched; then
        BUILD_RC=0
      else
        BUILD_RC=$?
      fi
      if [ "$BUILD_RC" = "2" ]; then
        exit 0
      fi
      if [ "$BUILD_RC" = "0" ]; then
        echo "[tsnet-patch] applying field-scoped Corefile update (ts.net:53 -> $NS_IP, attempt $ATTEMPT/$MAX_ATTEMPTS, resourceVersion $RV)..."
        if write_patch; then
          echo "[tsnet-patch] patched kube-system/coredns data.Corefile (attempt $ATTEMPT)"
          break
        fi
        echo "[tsnet-patch] WARN: patch write failed on attempt $ATTEMPT/$MAX_ATTEMPTS (conflict or transient)..." >&2
      else
        echo "[tsnet-patch] WARN: reconcile build failed on attempt $ATTEMPT/$MAX_ATTEMPTS..." >&2
      fi
      if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
        echo "[tsnet-patch] ERROR: reconcile failed after $MAX_ATTEMPTS attempts" >&2
        exit 1
      fi
      echo "[tsnet-patch] retrying in ${RETRY_SLEEP}s with a fresh read..."
      sleep "$RETRY_SLEEP"
    done

    # Documented activation: CoreDNS only serves the new stub after it
    # reloads. Prefer an explicit rollout restart of the narrowly scoped
    # deployment/coredns workload; when the restart is unavailable (RBAC or a
    # non-Deployment CoreDNS), say so loudly and fall back to the `reload`
    # plugin hot-reload (<=30s) instead of reporting false success.
    echo "[tsnet-patch] activating CoreDNS (rollout restart deployment/coredns in kube-system; fallback: reload plugin)..."
    if kubectl rollout restart deployment/coredns -n kube-system; then
      echo "[tsnet-patch] rollout restart triggered for deployment/coredns in kube-system"
    else
      echo "[tsnet-patch] WARN: rollout restart unavailable (RBAC or workload missing?) - relying on CoreDNS reload plugin (<=30s)"
    fi
    echo "[tsnet-patch] done"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coredns-tsnet-patch
  namespace: tailscale
  annotations:
    # One-shot convergence gate: a Sync hook (not an ordinary reapplied Job)
    # so every ArgoCD sync re-runs the gate. BeforeHookCreation + Replace let
    # the new hook run without colliding with the previous finished run.
    # The CronJob below deliberately stays an ordinary resource (NOT a hook):
    # it is the periodic drift healer between syncs.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns-tsnet-patch
        app.kubernetes.io/component: patch
    spec:
      serviceAccountName: coredns-tsnet-patch
      restartPolicy: OnFailure
      containers:
        - name: patch
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked via the
          # `kubectl jobs` group. Bitnami publishes only `latest` for kubectl
          # (holds kubectl 1.37.0, image build 2026-09-03) — digest is the pin.
          # Refresh: skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
          image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          env:
            - name: WAIT_SECS
              value: "600"
          command: ["/bin/bash", "/scripts/patch-coredns-tsnet.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: coredns-tsnet-patch-script
            defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coredns-tsnet-patch
  namespace: tailscale
  annotations:
    # Ordinary wave "-1" resource on purpose: the drift healer must run on a
    # schedule, NOT as a Sync hook (see the Job above).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: coredns-tsnet-patch
            app.kubernetes.io/component: patch
        spec:
          serviceAccountName: coredns-tsnet-patch
          restartPolicy: OnFailure
          containers:
            - name: patch
              image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: WAIT_SECS
                  value: "120"
              command: ["/bin/bash", "/scripts/patch-coredns-tsnet.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: coredns-tsnet-patch-script
                defaultMode: 0755
