# Shared S3 egress Service — lives in the tailscale namespace (wave -1) so every
# S3 consumer (velero, longhorn-system, ...) reaches RustFS through one proxy.
# Single source for the endpoint: gitops/values.yaml sharedS3.tailnetFqdn ->
# gitops/templates/platform/-1-ts-operator.yaml helm.parameter s3.tailnetFqdn -> here.
# tailnetFqdn is REQUIRED (empty on purpose — NO fallback literal: a stale
# default would point to no RustFS, so this Service fails loudly via `required`).
# Do NOT put a URL literal here.
# MIGRATION (step 1): platform/velero/templates/service-s3-egress.yaml is kept
# as a deprecated duplicate until consumers switch to s3-egress.tailscale and verify.
apiVersion: v1
kind: Service
metadata:
  name: s3-egress
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    tailscale.com/tailnet-fqdn: {{ required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}
    {{- with .Values.s3.hostname }}
    tailscale.com/hostname: {{ . }}
    {{- end }}
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
