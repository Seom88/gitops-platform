# Singleton Tailscale DNSConfig — deploys the ts.net nameserver whose
# ClusterIP the CoreDNS patch below forwards to (status.nameserver.ip).
# CRD (tailscale-operator 1.102.4, tailscale.com/v1alpha1) accepts only
# repo+tag under spec.nameserver.image — there is no digest field, so the
# digest is tracked in this comment and verified out-of-band:
#   tailscale/k8s-nameserver:stable@sha256:3676e2277ad16da948caee7952b2a27859a66b905edd981e1bb58b2626bc92a4
#   (verified 2026-09-24 via skopeo inspect; image created 2026-09-16;
#   refresh: skopeo inspect docker://tailscale/k8s-nameserver:stable | jq -r .Digest)
# Renovate's split repo:/tag: regex manager tracks this pair (renovate.json).
# Do NOT pin a nameserver IP here — the operator assigns the ClusterIP at
# runtime and publishes it in status.nameserver.ip (see ADR-011).
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: ts-dns
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  nameserver:
    image:
      repo: tailscale/k8s-nameserver
      tag: v1.102.4
