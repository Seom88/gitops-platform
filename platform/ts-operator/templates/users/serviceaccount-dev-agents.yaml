# ServiceAccount for AI coding agents running inside the devcontainer.
# Plain YAML (no helm templating): rendered automatically by the chart and
# synced by ArgoCD. No metadata.namespace — the chart installs into the
# `tailscale` namespace via the ArgoCD Application destination.
# This identity is bound to read-only RBAC by
# clusterrolebinding-dev-agents.yaml (deliberate exclusions are documented
# in clusterrole-dev-agents.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-agents
