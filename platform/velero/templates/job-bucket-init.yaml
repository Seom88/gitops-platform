{{- $bucketInit := .Values.bucketInit | default dict }}
{{- $initEnabled := true }}
{{- if hasKey $bucketInit "enabled" }}{{ $initEnabled = $bucketInit.enabled }}{{- end }}
{{- if and .Values.velero.enabled $initEnabled }}
{{- $fqdn := required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}
# NOTE (T-corr, live SNI evidence 2026-09-23): these Jobs dial
# https://<FQDN>:443 — RustFS aborts TLS unless SNI equals its LE-cert FQDN.
# One Job per bucket: the primary s3.bucket keeps the legacy name
# `velero-bucket-init`; each s3.extraBuckets entry renders
# `velero-bucket-init-<name>`. Script body source-of-truth lives in the
# s3-bucket-lib library chart (define "s3-bucket-lib.bucketInitScript");
# templates/_bucket-init.tpl re-exports it as "velero.bucketInitScript"
# (deprecated alias) so this Job — and any external caller still using the
# old name — renders the shared script. Other charts: depend on
# file://../s3-bucket-lib and copy this range block, not the script.
{{- $entries := list (dict "name" "velero" "bucket" (required "s3.bucket is required" .Values.s3.bucket)) }}
{{- range .Values.s3.extraBuckets | default list }}{{ $entries = append $entries . }}{{- end }}
{{- range $i, $entry := $entries }}
{{- if $i }}
---
{{- end }}
{{- $bucket := required "each s3.extraBuckets entry needs 'bucket'" $entry.bucket }}
{{- $slug := lower (required "each s3.extraBuckets entry needs 'name' (dns-safe slug)" $entry.name) }}
{{- $jobName := "velero-bucket-init" }}
{{- if ne $slug "velero" }}{{ $jobName = printf "velero-bucket-init-%s" $slug }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: velero
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook-weight: "-1"
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: {{ $bucketInit.backoffLimit | default 3 }}
  # Long TTL keeps finished Jobs (INCLUDING failures) around ~24h so
  # `kubectl logs job/<name>` evidence survives past the sync that ran it.
  # ArgoCD hook-delete-policy BeforeHookCreation still replaces hooks on
  # the next sync — TTL only governs post-finish GC, not hook lifecycle.
  ttlSecondsAfterFinished: {{ $bucketInit.ttlSecondsAfterFinished | default 86400 }}
  activeDeadlineSeconds: {{ $bucketInit.activeDeadlineSeconds | default 600 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $jobName }}
        app.kubernetes.io/component: bucket-init
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      dnsPolicy: ClusterFirst
      containers:
        - name: bucket-init
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked (regex manager
          # covers platform/*/templates). Refresh:
          # skopeo inspect docker://amazon/aws-cli:<tag> | jq -r .Digest
          image: amazon/aws-cli:2.37.4@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "velero.bucketInitScript" (dict "fqdn" $fqdn "region" $.Values.s3.region "bucket" $bucket "tag" $jobName) | nindent 14 }}
          volumeMounts:
            - name: cloud-credentials
              mountPath: /etc/velero
              readOnly: true
      volumes:
        - name: cloud-credentials
          secret:
            secretName: cloud-credentials
            optional: true
            items:
              - key: cloud
                path: cloud
{{- end }}
{{- end }}
