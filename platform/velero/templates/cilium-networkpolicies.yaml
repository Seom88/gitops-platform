{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for velero — Cilium-native mirror of existing K8s NetworkPolicies
# Keeps portfolio consistency: every platform chart now has Cilium policy (websearch-verified spec).

# 1) DNS (Cilium DNS-aware, mirroring velero-allow-dns)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero-allow-dns-cilium
  namespace: velero
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress — S3 (velero-homelab bucket) + kube-apiserver + Hubble
# S3 backend lives at s3.tailnetFqdn (from gitops/values.yaml) on 443, resolved
# via node MagicDNS (tailscaled on the host) through the default CoreDNS
# forward chain — no in-cluster ts.net stub, no s3-egress proxy Service.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero-allow-egress-cilium
  namespace: velero
spec:
  endpointSelector: {}
  egress:
    # S3 via tailnet FQDN (S3 at {{ required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}:443) — use FQDN + world with 443
    - toFQDNs:
        - matchName: {{ required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}
        - matchPattern: "*.lonk-mirfak.ts.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*.ts.net"
              - matchPattern: "*.lonk-mirfak.ts.net"
    # S3 via tailnet IP (FQDN-independent fallback, 443 only).
    # WHY: Cilium learns FQDN->IP mappings by observing DNS replies. Anything
    # that resolves the FQDN without DNS (e.g. an /etc/hosts pin) leaves
    # toFQDNs with no mapping, so the SYN is dropped (EOF in the bucket-init
    # Job) even though a world:443 rule exists. This toCIDR rule allows the
    # RustFS tailnet IP directly, regardless of how the name was resolved.
    # NOTE: 8443 (RustFS console UI) is intentionally NOT allowed — Velero
    # (server + bucket-init Job) only speaks the S3 API on 443.
    - toCIDR:
        - {{ required "s3.tailnetIp is required (set gitops/values.yaml sharedS3.tailnetIp)" .Values.s3.tailnetIp }}/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Hubble
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
    # Cluster-internal backups (PVC snapshots via kubelet/API)
    - toEntities:
        - host
        - remote-node
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# 3) Ingress — from monitoring (ServiceMonitor scraping) + host + Hubble
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero-allow-ingress-cilium
  namespace: velero
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
    # Cilium health/probe — narrowed to 8085 TCP (velero metrics) — no longer allow-all
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
{{- end }}
