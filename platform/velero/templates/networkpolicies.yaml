{{- if .Values.velero.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-allow-dns
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-allow-apiserver
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # kube-apiserver Service IP (10.96.0.1) + in-cluster endpoints — Velero MUST talk to API to list CRDs/backups
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.10.20.0/24
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-default-deny-egress
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  # No egress rules = default deny all egress; explicit allow NPs above provide exceptions
{{- end }}
