{{- if .Values.velero.enabled }}
{{- $fqdn := required "s3.tailnetFqdn is required (set gitops/values.yaml sharedS3.tailnetFqdn)" .Values.s3.tailnetFqdn }}
# BackupStorageLocation owned by this wrapper chart (NOT the upstream subchart):
# `velero.configuration.backupStorageLocation: []` in values.yaml.
# RustFS aborts TLS unless SNI equals its LE-cert FQDN, so the svc name can
# never handshake here (TLSV1_ALERT_INTERNAL_ERROR) and --no-verify-ssl /
# insecureSkipTLSVerify can never compensate (handshake dies first).
# SERVER-RESOLUTION GAP (follow-up, NOT solved here): the velero server pod
# resolves this FQDN via cluster DNS with no in-job hosts-pin available —
# the ts.net stub stays deleted and no static IP may be pinned (headless svc).
# Bucket/prefix/region are chart-owned in s3.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/part-of: velero
spec:
  provider: aws
  accessMode: ReadWrite
  objectStorage:
    bucket: {{ .Values.s3.bucket | quote }}
    prefix: {{ .Values.s3.prefix | quote }}
  config:
    region: {{ .Values.s3.region | quote }}
    s3ForcePathStyle: "true"
    s3Url: {{ printf "https://%s" $fqdn | quote }}
    insecureSkipTLSVerify: "true"
{{- end }}
