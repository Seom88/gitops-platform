apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-csi-wait
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-csi-wait
  namespace: longhorn-system
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "daemonsets/status", "deployments", "deployments/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-csi-wait
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: longhorn-csi-wait
    namespace: longhorn-system
roleRef:
  kind: Role
  name: longhorn-csi-wait
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-csi-wait
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata: {}
    spec:
      serviceAccountName: longhorn-csi-wait
      restartPolicy: Never
      containers:
        - name: csi-wait
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked via the
          # `kubectl jobs` group. Bitnami publishes only `latest` for kubectl
          # (holds kubectl 1.37.0, image build 2026-09-03) — digest is the pin.
          # Refresh: skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
          image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
          command:
            - /bin/bash
            - -ec
            - |
              set -e
              echo "Waiting for longhorn-driver-deployer rollout..."
              kubectl rollout status deployment/longhorn-driver-deployer -n longhorn-system --timeout=300s
              echo "Waiting for longhorn-csi-plugin DaemonSet (created by driver-deployer)..."
              for i in $(seq 1 60); do
                if kubectl get daemonset longhorn-csi-plugin -n longhorn-system &>/dev/null; then
                  kubectl rollout status daemonset/longhorn-csi-plugin -n longhorn-system --timeout=300s
                  echo "Longhorn CSI is ready."
                  exit 0
                fi
                sleep 10
              done
              echo "ERROR: longhorn-csi-plugin DaemonSet never appeared." >&2
              exit 1