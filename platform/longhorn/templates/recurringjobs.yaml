# Longhorn RecurringJobs — local hourly snapshots (no S3 backup target).
#
# Group model: Longhorn matches RecurringJobs to volumes by GROUP via the
# Volume-CR label `recurring-job-group.longhorn.io/<group>=enabled`
# (group name must match `.spec.groups` of a RecurringJob).
#
#   - vault-hourly -> opt-IN job below (hourly snapshot, retain 24 = ~1 day of
#                     hourly recovery points). Vault is EXCLUDED from Velero
#                     (Raft restores corrupt the cluster); crash-consistency comes
#                     from these lightweight local snapshots. DR itself is
#                     re-bootstrap via platform/vault/scripts/bootstrap-vault.sh +
#                     secret rotation, not restore. Label Vault volumes explicitly:
#                       kubectl -n longhorn-system label volume <vault-volume-name> \
#                         recurring-job-group.longhorn.io/vault-hourly=enabled
#   - default      -> AUTO-applies ONLY to volumes that carry NO
#                     `recurring-job-group.longhorn.io/*` label at all. A volume
#                     with at least one such label leaves the `default` group.
#                     Job below: every 2h (`0 */2 * * *`), retain 12 = 24h coverage.
#   - seaweedfs-backup -> backup-only daily 05:00, retain 3. SeaweedFS manages
#                     its own replication; snapshots only waste I/O, so NO
#                     snapshot job is bound. Label SeaweedFS volumes explicitly:
#                       kubectl -n longhorn-system label volume <seaweed-volume> \
#                         recurring-job-group.longhorn.io/seaweedfs-backup=enabled
#   - monitoring-backup -> backup-only daily 05:30, retain 3. Same rationale
#                     (reproducible / S3-backed data). Label:
#                       kubectl -n longhorn-system label volume <mon-volume> \
#                         recurring-job-group.longhorn.io/monitoring-backup=enabled
#   - cnpg-backup -> backup-only daily 06:00, retain 3. CNPG clusters already
#                     have app-consistent Barman backups to SeaweedFS S3
#                     (immich-db-backups, grafana-db-backups); Longhorn 2h
#                     crash-consistent snapshots add I/O for little value, but
#                     the daily Longhorn S3 copy stays as the SeaweedFS-
#                     independent off-site copy. Label DB data volumes:
#                       kubectl -n longhorn-system label volume <db-volume> \
#                         recurring-job-group.longhorn.io/cnpg-backup=enabled
#                     IMPORTANT: moving a volume OUT of snapshots requires
#                     REMOVING the default label (a volume with both labels gets
#                     both jobs):
#                       kubectl -n longhorn-system label volume <vol> \
#                         recurring-job-group.longhorn.io/default-
#   - no-snapshot  -> LEGACY MARKER, no RecurringJob bound. Kept only for
#                     volumes intentionally excluded from ALL jobs. Do NOT use
#                     for SeaweedFS/monitoring anymore — relabel them to the
#                     backup groups above (remove no-snapshot, add new label).
#
# IMPORTANT: the label must live on the Longhorn Volume CR in `longhorn-system`,
# NOT on the PVC — the CSI provisioner does not copy PVC labels to Volume CRs,
# so labeling PVCs/templates has no effect on recurring jobs. SeaweedFS
# (platform/seaweedfs, incl. templates/master-pvc.yaml) and monitoring
# (platform/monitoring: Loki persistence, Prometheus volumeClaimTemplate) PVCs
# are provisioned by subcharts, hence the opt-out is applied post-provisioning
# with the kubectl commands above, not via PVC template labels.
#
# Snapshot vs backup: `snapshot` is local + instant (no backup target needed);
# `backup` uploads to the S3 backup target
# (longhorn.defaultBackupStore.backupTarget = s3://longhorn-homelab@us-east-1/
# on RustFS, creds from Secret longhorn-backup-secret). The
# `default-daily-backup` job below uses it: 04:00 daily (after Velero
# daily-full 02:00 to avoid I/O overlap), retain 3. Same group semantics:
# applies ONLY to volumes with no `recurring-job-group.longhorn.io/*` label,
# so vault-hourly / no-snapshot volumes stay excluded automatically.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: vault-hourly-snapshot
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: vault-hourly-snapshot
  # Hourly, at minute 0. Matches the retired Velero vault-hourly cadence.
  cron: "0 * * * *"
  task: snapshot
  groups:
    - vault-hourly
  # 24 hourly snapshots ≈ 1 day of rollback window. Snapshots are
  # copy-on-write and cheap; old ones prune automatically.
  retain: 24
  concurrency: 1
  labels:
    snapshot: hourly
    volume: vault
---
# Default snapshots every 2h, retain 12 = 24h coverage. Applies automatically
# ONLY to volumes with no `recurring-job-group.longhorn.io/*` label. Vault uses
# its own hourly job above (label: vault-hourly); SeaweedFS + monitoring are
# excluded via the marker label `recurring-job-group.longhorn.io/no-snapshot`
# (no job bound to that group, so nothing runs on them).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-2h-snapshot
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: default-2h-snapshot
  cron: "0 */2 * * *"
  task: snapshot
  groups:
    - default
  retain: 12
  concurrency: 2
  labels:
    snapshot: 2h
    volume: default
---
# Daily S3 backup of every volume in the `default` group (i.e. volumes with
# NO recurring-job-group label — vault-hourly and no-snapshot volumes are
# excluded automatically). 04:00 avoids overlapping Velero daily-full (02:00).
# Requires the backup target + credential secret (values longhorn.defaultBackupStore).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-daily-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: default-daily-backup
  cron: "0 4 * * *"
  task: backup
  groups:
    - default
  retain: 3
  concurrency: 1
  labels:
    backup: daily
    volume: default
---
# Daily S3 backup for SeaweedFS object data (backup-only, NO snapshots).
# SeaweedFS manages its own replication; snapshots only waste I/O. Label:
#   kubectl -n longhorn-system label volume <seaweed-volume> \
#     recurring-job-group.longhorn.io/seaweedfs-backup=enabled
# 05:00 avoids overlapping Velero daily-full (02:00) and default-daily-backup (04:00).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: seaweedfs-daily-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: seaweedfs-daily-backup
  cron: "0 5 * * *"
  task: backup
  groups:
    - seaweedfs-backup
  retain: 3
  concurrency: 1
  labels:
    backup: daily
    volume: seaweedfs
---
# Daily S3 backup for monitoring volumes (backup-only, NO snapshots).
# Prometheus/Loki data is reproducible or S3-backed. Label:
#   kubectl -n longhorn-system label volume <mon-volume> \
#     recurring-job-group.longhorn.io/monitoring-backup=enabled
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monitoring-daily-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: monitoring-daily-backup
  cron: "30 5 * * *"
  task: backup
  groups:
    - monitoring-backup
  retain: 3
  concurrency: 1
  labels:
    backup: daily
    volume: monitoring
---
# Daily S3 backup for CNPG database data volumes (backup-only, NO snapshots).
# Barman ScheduledBackups already cover PITR; this is the independent RustFS
# copy. Move each DB data volume OUT of default (remove default label, add new):
#   kubectl -n longhorn-system label volume <db-volume> recurring-job-group.longhorn.io/default-
#   kubectl -n longhorn-system label volume <db-volume> recurring-job-group.longhorn.io/cnpg-backup=enabled
# 06:00 avoids overlapping Velero (02:00), default-daily-backup (04:00),
# seaweedfs (05:00) and monitoring (05:30) jobs.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: cnpg-daily-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: longhorn
spec:
  name: cnpg-daily-backup
  cron: "0 6 * * *"
  task: backup
  groups:
    - cnpg-backup
  retain: 3
  concurrency: 1
  labels:
    backup: daily
    volume: cnpg
