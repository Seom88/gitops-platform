# target volumes with `recurring-job-group.longhorn.io/<group>: enabled`,
# remembering to REMOVE the default label so the volume leaves both default jobs.
# NOTE: seaweedfs/monitoring stay intentionally EXCLUDED via the `no-snapshot`
# marker label (see header) — only uncomment these if that policy is reversed
# and the volumes are relabeled to the corresponding group.
