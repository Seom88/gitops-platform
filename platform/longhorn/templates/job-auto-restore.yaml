{{- if .Values.autoRestore.enabled }}
# Longhorn auto-restore — idempotent recovery of data volumes from S3 backups.
#
# On every ArgoCD sync (fresh-cluster rollout or restart with lost disks) this
# Sync-hook Job runs at local wave 2 — after bucket-init (wave 0) and csi-wait
# (wave 1), and because the whole longhorn Application is App-of-Apps wave -1,
# always BEFORE any platform/app PVC can provision an empty replacement volume.
# No syncwave has to be stopped and no manual UI/CR restore is needed.
#
# What it does: for every BackupVolume in the `default` group (label
# `volume=default`, set by the default-daily-backup RecurringJob), resolve the
# latest Completed Backup and re-create the Longhorn Volume CR from its exact
# backup URL + exact byte size (the admission webhook rejects anything else,
# including bare `?volume=x` URLs without a backup ID). Volumes that already
# exist are skipped — never overwrite, never delete — so re-running on a
# healthy cluster is a safe no-op.
#
# Vault is NEVER restored here: vault-hourly-snapshot is task snapshot (local
# only, no Backup CRs), so the `-l volume=default` selector excludes it by
# construction. SeaweedFS/monitoring carry the no-snapshot marker for the same
# reason. System Backup Bundle is intentionally not used (manual, GitOps-hostile).
#
# Scope v1: Volume CRs only (namespaced RBAC, no ClusterRole). Rebinding
# workloads to restored volumes (PV/PVC surgery) stays a documented phase-2
# follow-up; restored volumes land Detached and ready to attach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-auto-restore
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-auto-restore
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # Read the backup inventory + create missing Volumes. No update/patch/delete:
  # existing volumes are never touched.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "volumes/status", "backups", "backups/status", "backupvolumes", "backupvolumes/status"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-auto-restore
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: longhorn-auto-restore
    namespace: longhorn-system
roleRef:
  kind: Role
  name: longhorn-auto-restore
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-auto-restore
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-auto-restore
        app.kubernetes.io/component: auto-restore
    spec:
      serviceAccountName: longhorn-auto-restore
      restartPolicy: OnFailure
      dnsPolicy: ClusterFirst
      containers:
        - name: auto-restore
          # Digest-pinned (fail-closed Trivy gate); same pin as csi-wait-job.
          # Refresh: skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
          image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              NS="longhorn-system"
              REPLICAS="{{ .Values.autoRestore.numberOfReplicas }}"
              echo "[auto-restore] Longhorn volume auto-restore from S3 backups (default group only)..."

              # Wait for the Longhorn backup CRDs to be served (manager may still
              # be coming up even after CSI is ready).
              READY=0
              WAITED=0
              for _ in $(seq 1 24); do
                if kubectl get backupvolumes.longhorn.io -n "$NS" >/dev/null 2>&1; then
                  READY=1
                  break
                fi
                WAITED=$((WAITED + 5))
                echo "[auto-restore] Waiting for backupvolumes CRD (${WAITED}s)..."
                sleep 5
              done
              if [ "$READY" != "1" ]; then
                echo "[auto-restore] ERROR: backupvolumes.longhorn.io never became readable — is longhorn-manager up?" >&2
                exit 1
              fi

              # One line per default-group backup:
              #   <backup-name> <backup-volume-label> <spec.volumeName> <state> <url> <volumeSize> <creationTimestamp>
              # URL/size/timestamp contain no spaces, so space-splitting is safe.
              # Label key needs bracket syntax (dash in key name).
              ROWS="$(kubectl get backups.longhorn.io -n "$NS" -l volume=default \
                -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels['\''backup-volume'\'']}{" "}{.spec.volumeName}{" "}{.status.state}{" "}{.status.url}{" "}{.status.volumeSize}{" "}{.metadata.creationTimestamp}{"\n"}{end}' \
                2>/dev/null || true)"
              if [ -z "${ROWS//[[:space:]]/}" ]; then
                echo "[auto-restore] No default-group backups found — nothing to restore."
                exit 0
              fi

              # Pick the latest Completed backup per volume (ISO timestamps sort lexicographically).
              declare -A BEST_TS=() BEST_URL=() BEST_SIZE=()
              while read -r _name lbl specvol state url size ts; do
                [ -n "${lbl:-}" ] || lbl="${specvol:-}"
                [ -n "${lbl:-}" ] || continue
                [ "${state:-}" = "Completed" ] || continue
                [ -n "${url:-}" ] && [ -n "${size:-}" ] && [ -n "${ts:-}" ] || continue
                if [ -z "${BEST_TS[$lbl]:-}" ] || [[ "$ts" > "${BEST_TS[$lbl]}" ]]; then
                  BEST_TS[$lbl]="$ts"
                  BEST_URL[$lbl]="$url"
                  BEST_SIZE[$lbl]="$size"
                fi
              done <<< "$ROWS"

              if [ "${#BEST_TS[@]}" -eq 0 ]; then
                echo "[auto-restore] No Completed default-group backup with URL+size — nothing to restore."
                exit 0
              fi

              RESTORED=0
              SKIPPED=0
              for VOL in "${!BEST_TS[@]}"; do
                if kubectl get volume.longhorn.io "$VOL" -n "$NS" >/dev/null 2>&1; then
                  echo "[auto-restore] skip: volume $VOL already exists (never overwrite)."
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                echo "[auto-restore] restoring volume $VOL from ${BEST_TS[$VOL]} (size ${BEST_SIZE[$VOL]} B)..."
                cat <<EOF | kubectl apply -f -
              apiVersion: longhorn.io/v1beta2
              kind: Volume
              metadata:
                name: $VOL
                namespace: $NS
                labels:
                  longhorn-auto-restore/restored: "true"
              spec:
                size: "${BEST_SIZE[$VOL]}"
                fromBackup: "${BEST_URL[$VOL]}"
                numberOfReplicas: $REPLICAS
                frontend: blockdev
                dataEngine: v1
              EOF
                RESTORED=$((RESTORED + 1))
              done
              echo "[auto-restore] Done: restored=$RESTORED skipped-existing=$SKIPPED."
{{- end }}
