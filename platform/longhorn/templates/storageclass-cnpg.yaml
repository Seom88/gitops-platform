# Dedicated StorageClass for CloudNativePG data volumes.
# 1 replica (homelab sizing, mirrors the default `longhorn` class) and
# `recurringJobGroup: cnpg-backup`: every provisioned DB volume auto-enrolls
# in the backup-only `cnpg-daily-backup` RecurringJob (06:00, retain 3, S3 on
# RustFS) and gets NO snapshots — Barman to SeaweedFS S3 is the app-consistent
# copy, the Longhorn S3 copy is the SeaweedFS-independent off-site copy.
# Consumed via `cnpg.storage.class: longhorn-cnpg` (shared `cnpg` library
# chart). Applies to NEW PVCs only: volumes already provisioned on another
# class stay put until recreated (or relabeled manually per the
# `cnpg-backup` group docs in templates/recurringjobs.yaml).
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-cnpg
  annotations:
    argocd.argoproj.io/sync-options: Replace=true # parameters are immutable; allow replace on changes
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  recurringJobGroup: "cnpg-backup"
