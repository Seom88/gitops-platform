{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for longhorn-system.
# NOTE: the upstream subchart ships K8s NetworkPolicies gated on
# networkPolicies.restrictInternalTraffic (default true) but they are
# Ingress-only — they never restrict EGRESS. So THESE Cilium policies own all
# egress enforcement: keep DNS/FQDN/world coverage in sync here.
# This adds DNS-aware egress, Hubble, and explicit intra-longhorn allowlists to
# match Cilium identity semantics. No off-site egress: Longhorn sends no volume
# data anywhere (Velero owns the off-site copy).

# 1) DNS
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-allow-dns
  namespace: longhorn-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress — intra-longhorn + kube-apiserver + host + Hubble
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-allow-egress
  namespace: longhorn-system
spec:
  endpointSelector: {}
  egress:
    # Intra-longhorn — allow all ports (manager 9500, frontend 8000, instance-manager 8500-8503, webhooks, and replica data 10000-30000)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Tailscale gateway -> longhorn-frontend (80) is ingress direction.
    # Hubble observability
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
# 3) Ingress — allow scrapes from monitoring + tailscale gateway + kube-apiserver (webhooks) + intra + host
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-allow-ingress
  namespace: longhorn-system
spec:
  endpointSelector: {}
  ingress:
    # Intra-longhorn — allow all ports (manager 9500, frontend 8000, instance-manager 8500-8503, webhooks, and replica data 10000-30000)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            k8s:tailscale.com/managed: "true"
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # entity ingress narrowed from allow-all: frontend 8000 + manager 9500 health/api; cluster entity removed as overbroad
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9500"
              protocol: TCP
{{- end }}
