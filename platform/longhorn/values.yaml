ciliumNetworkPolicy:
  enabled: true

# Shared S3 endpoint — single source for the URL: gitops/values.yaml
# sharedS3.tailnetFqdn (literal) -> gitops/templates/platform/00-longhorn.yaml
# helm.parameter s3.tailnetFqdn -> here (Cilium egress + bucket-init Job).
# tailnetFqdn is REQUIRED (empty on purpose — NO fallback literal).
# bucket/region mirror velero-homelab conventions (us-east-1, path-style).
s3:
  tailnetFqdn: ""
  bucket: longhorn-homelab
  region: us-east-1

# Auto-restore data volumes from S3 backups on (re)start — idempotent
# ArgoCD Sync-hook Job (platform/longhorn/templates/job-auto-restore.yaml,
# local wave 2, after bucket-init wave 0 and csi-wait wave 1).
# Restores every backup labeled backup=daily (default-daily-backup plus the
# seaweedfs/monitoring/cnpg backup-only groups); vault-hourly is snapshot-only
# and legacy no-snapshot volumes produce no Backup CRs, so Vault and fully
# excluded volumes are never touched.
autoRestore:
  enabled: true
  # Must mirror longhorn.defaultSettings.defaultReplicaCount (single-zone homelab).
  numberOfReplicas: 1

longhorn:
  # Default backup target (RustFS S3-compatible). Endpoint + credentials come
  # from the bootstrap-created Secret longhorn-system/longhorn-backup-secret
  # (bootstrap/init-gitops.sh:ensureLonghornBackupCredentials(), keys
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS). No AWS_CERT:
  # RustFS serves a public Let's Encrypt cert (verified 2026-09-21).
  # NOTE: backupTarget is a literal — keep bucket@region in sync with s3.*
  # above (values files are not templated).
  defaultBackupStore:
    backupTarget: "s3://longhorn-homelab@us-east-1/"
    backupTargetCredentialSecret: longhorn-backup-secret  # pragma: allowlist secret
  defaultSettings:
    defaultReplicaCount: 1
    replicaSoftAntiAffinity: false
    # single-zone homelab, pin explicit to avoid silent upstream default change.
    replicaZoneSoftAntiAffinity: true
    replicaDiskSoftAntiAffinity: true
    replicaAutoBalance: "least-effort"
    # Best-practices allow-volumes-creation-with-degraded-availability: refuse
    # to create volumes when full replica availability cannot be satisfied.
    allowVolumeCreationWithDegradedAvailability: false
    # Best-practices io-performance/data-locality: prefer a local replica on the
    # workload node; best-effort keeps scheduling flexible in a small homelab.
    defaultDataLocality: best-effort
    # Measured 2026-09-22: volumes average <10% fill (PrometheusDB 7%,
    # Loki ~0%, SeaweedFS data1 <1%, Trivy 28%, Vault ~1%, ImmichDB ~2%).
    # 15% (~24Gi/disk) still covers OS + bursts; frees ~70Gi cluster-wide.
    storageReservedPercentageForDefaultDisk: 15
    # Best-practices (Longhorn 1.12.1): 25% minimal-available is the root-disk
    # default; /var/mnt/data is a dedicated disk so 10% applies.
    storageMinimalAvailablePercentage: 10
    # Best-practices (Longhorn 1.12.1): 100 is the safe upstream default;
    # 200 is only justified when volumes average ~50% fill (not observed here).
    storageOverProvisioningPercentage: 100
    # Lean homelab sizing (prod): upstream Longhorn has no
    # instanceManager.resources key — instance-manager CPU reservation is
    # this percentage of each node's allocatable CPU (default
    # {"v1":"12","v2":"12"} ~= 714m request). v1 "4" lands ~250m on ~6-CPU
    # nodes; v2 stays 12 (SPDK needs dedicated cores for stability).
    # No CPU limit is ever set on instance-manager pods — never cap engine IO.
    # WARNING: changing this restarts instance-manager pods; apply only with
    # volumes detached or during a maintenance window.
    guaranteedInstanceManagerCPU: '{"v1":"4","v2":"12"}'
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    # must match UserVolumeConfig name=data -> /var/mnt/data
    defaultDataPath: /var/mnt/data
    defaultLonghornStaticStorageClass: longhorn-static
  preUpgradeChecker:
    # ArgoCD/GitOps: disable pre-upgrade hook Job (requires CRDs + ClusterRole that are
    # not yet synced when helm.sh/hook: pre-upgrade runs — deadlock: SA exists but
    # ClusterRole/CRDs are Sync-phase, so GET settings.longhorn.io/current-longhorn-version
    # fails with Forbidden and pod exits 1s -> BackoffLimitExceeded). Chart docs:
    # "Disable this setting when installing Longhorn using Argo CD or other GitOps solutions."
    jobEnabled: false
    upgradeVersionCheck: false
  longhornManager:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  longhornUI:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 1
    # Best-practices io-performance/data-locality: mirror defaultSettings so the
    # default StorageClass prefers a local replica (best-effort scheduling).
    defaultDataLocality: best-effort
    migratable: true
    reclaimPolicy: Delete
  ingress:
    enabled: false
    ingressClassName: ""
    host: ""
    tls: false
    tlsSecret: ""

  # P2 defensive pin — ServiceMonitor decoupling: keep scraping in monitoring chart.
  # longhorn/longhorn 1.12.1 defaults to metrics.serviceMonitor.enabled=false;
  # pin explicitly so future chart bumps do not re-enable chicken-and-egg CRD dependency.
  metrics:
    serviceMonitor:
      enabled: false

# Per-app Tailscale Ingress (moved from platform/ts-ingress, ADR-018)
tailscaleIngress:
  longhorn:
    enabled: true
    hostname: longhorn
