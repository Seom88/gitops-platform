{{- if .Values.tailscaleIngress.vault.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  name: https
  tls:
  - hosts:
    - {{ .Values.tailscaleIngress.vault.hostname }}
{{- end }}
