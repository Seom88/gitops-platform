apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-autounseal
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-autounseal
    app.kubernetes.io/component: operations
  annotations:
    velero.io/exclude-from-backup: "false"
    backup.velero.io/backup: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-autounseal
  # Recreate ensures there is never more than one watcher running at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-autounseal
        app.kubernetes.io/component: operations
      annotations:
        velero.io/exclude-from-backup: "false"
        backup.velero.io/backup: "true"
    spec:
      serviceAccountName: vault-autounseal
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: autounseal
          # Digest-pinned (fail-closed Trivy gate); Renovate `kubectl jobs` group.
          # Refresh: skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
          image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              echo "[watcher] Vault unseal watcher (HTTP) started."

              _CHILD_PID=0
              _shutdown() {
                if [ "$_CHILD_PID" -ne 0 ]; then
                  kill "$_CHILD_PID" 2>/dev/null || true
                  wait "$_CHILD_PID" 2>/dev/null || true
                fi
                exit 0
              }
              trap _shutdown TERM INT

              while true; do
                /scripts/unseal.sh &
                _CHILD_PID=$!
                wait "$_CHILD_PID"
                EXIT_CODE=$?
                _CHILD_PID=0
                if [ "$EXIT_CODE" -eq 0 ]; then
                  # Everything healthy - sleep longer to reduce load on the mini PC.
                  sleep "${SLEEP_HEALTHY:-15}" &
                else
                  # Something sealed or unreachable - retry sooner.
                  sleep "${SLEEP_UNHEALTHY:-5}" &
                fi
                _CHILD_PID=$!
                wait "$_CHILD_PID"
                _CHILD_PID=0
              done

          env:
            - name: VAULT_NAMESPACE
              value: "vault"
            - name: VAULT_CACERT
              value: "/vault/userconfig/vault-tls/ca.crt"
            # Kept under Vault's readinessProbe budget (30s initial delay +
            # 6x10s period = ~90s until NotReady): a 60s healthy sleep still
            # unseals restarted pods inside that window, while forking two
            # kubectl processes 4x less often — the watcher otherwise burns
            # ~24m CPU doing nothing but idle polling. Unhealthy fast-retry
            # stays at 5s so real seal events still converge in seconds.
            - name: SLEEP_HEALTHY
              value: "60"
            - name: SLEEP_UNHEALTHY
              value: "5"

          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: vault-tls
              mountPath: /vault/userconfig/vault-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

      volumes:
        - name: script
          configMap:
            name: vault-autounseal-script
            defaultMode: 0555
        # NEW: this wasn't mounted before - curl needs the CA to verify
        # the Vault server's certificate over HTTPS.
        - name: vault-tls
          secret:
            secretName: vault-tls
        - name: tmp
          emptyDir: {}
