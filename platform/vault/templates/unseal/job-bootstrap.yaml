apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-bootstrap
    app.kubernetes.io/component: operations
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-bootstrap
    app.kubernetes.io/component: operations
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-bootstrap
    app.kubernetes.io/component: operations
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: vault-bootstrap
    app.kubernetes.io/component: operations
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-bootstrap
        app.kubernetes.io/component: operations
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: bootstrap
          # Digest-pinned (fail-closed Trivy gate); Renovate `kubectl jobs` group.
          # Refresh: skopeo inspect docker://bitnami/kubectl:latest | jq -r .Digest
          image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              set -e

              VAULT_NAMESPACE="${VAULT_NAMESPACE:-vault}"
              TLS_SERVER_NAME="${VAULT_TLS_SERVER_NAME:-vault}"

              vault_kubectl() { kubectl exec -i -n "$VAULT_NAMESPACE" "$@"; }

              retry() {
                local n=1
                local max=5
                local delay=2
                while true; do
                  if "$@"; then
                    break
                  fi
                  if [[ $n -lt $max ]]; then
                    ((n++))
                    sleep $delay
                  else
                    return 1
                  fi
                done
              }

              vault_status() {
                local pod=$1
                timeout 10 kubectl exec -i -n "$VAULT_NAMESPACE" "$pod" -- /bin/sh -c "env VAULT_CACERT=/vault/userconfig/vault-tls/ca.crt vault status -format=json -tls-server-name=$TLS_SERVER_NAME || true" 2>/dev/null || true
              }

              vault_exec() {
                local pod=$1
                local cmd=$2
                vault_kubectl "$pod" -- /bin/sh -c "env VAULT_CACERT=/vault/userconfig/vault-tls/ca.crt $cmd" 2>/dev/null
              }

              # Return the first Running pod that is responsive (vault status shows .version).
              # Usage: find_healthy_pod (prints pod name to stdout). Returns 1 if none found.
              find_healthy_pod() {
                local pod
                local phase
                for pod in $(kubectl get pods -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault,component=server -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                  phase=$(kubectl get pod "$pod" -n "$VAULT_NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
                  if [ "$phase" != "Running" ]; then
                    continue
                  fi
                  if vault_status "$pod" | jq -e '.version' >/dev/null 2>&1; then
                    echo "$pod"
                    return 0
                  fi
                done
                return 1
              }

              vault_auth_write() {
                local path=$1
                shift
                echo "  [Vault] Configuring $path..."
                retry vault_kubectl "$VAULT_POD" -- env VAULT_CACERT=/vault/userconfig/vault-tls/ca.crt VAULT_TOKEN="$ROOT_TOKEN" vault write -tls-server-name="$TLS_SERVER_NAME" "$path" "$@" > /dev/null 2>&1
              }

              echo "  [Vault] Starting bootstrap..."

              # 1. Wait for StatefulSet to exist
              echo -n "  [Vault] Waiting for StatefulSet to be created..."
              until kubectl get statefulset -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault -o name | grep -q "statefulset" 2>/dev/null; do
                echo -n "."
                sleep 2
              done
              echo " Created!"

              # Wait for all pods to be Running (not Ready — sealed pods fail readinessProbe)
              DESIRED_REPLICAS=$(kubectl get statefulset -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault -o jsonpath='{.items[0].spec.replicas}' 2>/dev/null || echo "0")
              echo -n "  [Vault] Waiting for all ($DESIRED_REPLICAS) pods to be running..."
              RETRY_ERRORS=0
              MAX_ERRORS=3
              while true; do
                if ! RUNNING_OUTPUT=$(kubectl get pods -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault,component=server --field-selector=status.phase=Running -o name 2>/dev/null); then
                  RETRY_ERRORS=$((RETRY_ERRORS + 1))
                  if [ "$RETRY_ERRORS" -ge "$MAX_ERRORS" ]; then
                    echo ""
                    echo "  [Vault] Failed to query pod status after $MAX_ERRORS retries"
                    exit 1
                  fi
                  sleep 2
                  continue
                fi
                RETRY_ERRORS=0
                RUNNING_COUNT=$(echo "$RUNNING_OUTPUT" | grep -c "pod/" || true)
                DESIRED_REPLICAS=$(kubectl get statefulset -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault -o jsonpath='{.items[0].spec.replicas}' 2>/dev/null || echo "0")
                if [ "$RUNNING_COUNT" -ge "$DESIRED_REPLICAS" ] && [ "$DESIRED_REPLICAS" -gt 0 ]; then
                  break
                fi
                echo -n "."
                sleep 5
              done
              echo " All $RUNNING_COUNT/$DESIRED_REPLICAS pods running!"

              if ! VAULT_POD=$(find_healthy_pod); then
                echo "  [Vault] ERROR: no responsive Running pod found"
                exit 1
              fi
              RELEASE_NAME=$(kubectl get pod "$VAULT_POD" -n "$VAULT_NAMESPACE" -o jsonpath="{.metadata.labels['app\.kubernetes\.io/instance']}")
              SECRET_NAME="${RELEASE_NAME}-unseal-keys"

              # 2. Initialization (idempotent)
              STATUS=$(vault_status "$VAULT_POD")
              if echo "$STATUS" | jq -e '.initialized == false' >/dev/null 2>&1; then
                echo "  [Vault] Initializing..."
                INIT_OUT=$(vault_kubectl "$VAULT_POD" -- /bin/sh -c "env VAULT_CACERT=/vault/userconfig/vault-tls/ca.crt vault operator init -format=json -key-shares=3 -key-threshold=2 -tls-server-name=$TLS_SERVER_NAME")
                ROOT_TOKEN=$(echo "$INIT_OUT" | jq -r '.root_token')
                KEY1=$(echo "$INIT_OUT" | jq -r '.unseal_keys_b64[0]')
                KEY2=$(echo "$INIT_OUT" | jq -r '.unseal_keys_b64[1]')
                KEY3=$(echo "$INIT_OUT" | jq -r '.unseal_keys_b64[2]')
                kubectl create secret generic "$SECRET_NAME" -n "$VAULT_NAMESPACE" \
                  --from-literal=root-token="$ROOT_TOKEN" \
                  --from-literal=key1="$KEY1" \
                  --from-literal=key2="$KEY2" \
                  --from-literal=key3="$KEY3" \
                  --dry-run=client -o yaml | kubectl apply -f - > /dev/null 2>&1
                echo "  [Vault] Initialized and keys saved to $SECRET_NAME"
              else
                echo "  [Vault] Already initialized, skipping init."
              fi

              # 3. Unseal all pods (quorum-tolerant: skip non-Running / unresponsive pods, idempotent)
              echo "  [Vault] Checking seal status for all pods..."
              HEALTHY_COUNT=0
              UNSEALED_COUNT=0
              FAILED_PODS=""
              for POD in $(kubectl get pods -n "$VAULT_NAMESPACE" -l app.kubernetes.io/name=vault,component=server -o jsonpath='{.items[*].metadata.name}'); do
                POD_PHASE=$(kubectl get pod "$POD" -n "$VAULT_NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
                if [ "$POD_PHASE" != "Running" ]; then
                  echo "  [Vault] WARNING: skipping pod $POD (phase $POD_PHASE, e.g. ContainerCreating); will retry on next run."
                  FAILED_PODS="$FAILED_PODS $POD"
                  continue
                fi
                echo -n "  [Vault] Waiting for pod $POD to be responsive..."
                ATTEMPTS=0
                until vault_status "$POD" | jq -e '.version' >/dev/null 2>&1; do
                  ATTEMPTS=$((ATTEMPTS+1))
                  if [ "$ATTEMPTS" -ge 60 ]; then
                    echo ""
                    echo "  [Vault] WARNING: pod $POD never became responsive (vault status timeout); skipping."
                    FAILED_PODS="$FAILED_PODS $POD"
                    break
                  fi
                  echo -n "."
                  sleep 2
                done
                if ! vault_status "$POD" | jq -e '.version' >/dev/null 2>&1; then
                  continue
                fi
                echo " Responsive!"
                HEALTHY_COUNT=$((HEALTHY_COUNT + 1))
                STATUS=$(vault_status "$POD")
                SEALED=$(echo "$STATUS" | jq -r '.sealed')
                if [ "$SEALED" == "true" ]; then
                  echo "  [Vault] Unsealing pod $POD..."
                  KEY1=$(kubectl get secret "$SECRET_NAME" -n "$VAULT_NAMESPACE" -o jsonpath='{.data.key1}' | base64 -d)
                  KEY2=$(kubectl get secret "$SECRET_NAME" -n "$VAULT_NAMESPACE" -o jsonpath='{.data.key2}' | base64 -d)
                  KEY3=$(kubectl get secret "$SECRET_NAME" -n "$VAULT_NAMESPACE" -o jsonpath='{.data.key3}' | base64 -d)
                  retry vault_exec "$POD" "vault operator unseal -tls-server-name=$TLS_SERVER_NAME $KEY1" > /dev/null 2>&1
                  retry vault_exec "$POD" "vault operator unseal -tls-server-name=$TLS_SERVER_NAME $KEY2" > /dev/null 2>&1
                  retry vault_exec "$POD" "vault operator unseal -tls-server-name=$TLS_SERVER_NAME $KEY3" > /dev/null 2>&1
                  echo "  [Vault] Pod $POD unsealed!"
                  UNSEALED_COUNT=$((UNSEALED_COUNT + 1))
                else
                  echo "  [Vault] Pod $POD is already unsealed."
                  UNSEALED_COUNT=$((UNSEALED_COUNT + 1))
                fi
              done
              if [ "$HEALTHY_COUNT" -ge "$DESIRED_REPLICAS" ]; then
                echo "  [Vault] All pods healthy ($HEALTHY_COUNT/$DESIRED_REPLICAS)."
              else
                echo "  [Vault] ERROR: only $HEALTHY_COUNT/$DESIRED_REPLICAS pods healthy; failing."
                exit 1
              fi

              # 4. Configure Vault (re-resolve a healthy pod; the earlier VAULT_POD may be stale, idempotent — mirrors bootstrap-vault.sh step 4)
              if ! VAULT_POD=$(find_healthy_pod); then
                echo "  [Vault] ERROR: no responsive Running pod available for configuration"
                exit 1
              fi
              ROOT_TOKEN=$(kubectl get secret "$SECRET_NAME" -n "$VAULT_NAMESPACE" -o jsonpath='{.data.root-token}' | base64 -d)
              echo "  [Vault] Configuring engines and auth..."
              vault_exec "$VAULT_POD" "VAULT_TOKEN=$ROOT_TOKEN vault secrets list -tls-server-name=$TLS_SERVER_NAME" | grep -q "secret/" || \
                vault_exec "$VAULT_POD" "VAULT_TOKEN=$ROOT_TOKEN vault secrets enable -path=secret -tls-server-name=$TLS_SERVER_NAME kv-v2" > /dev/null 2>&1
              vault_exec "$VAULT_POD" "VAULT_TOKEN=$ROOT_TOKEN vault auth list -tls-server-name=$TLS_SERVER_NAME" | grep -q "kubernetes/" || \
                vault_exec "$VAULT_POD" "VAULT_TOKEN=$ROOT_TOKEN vault auth enable -tls-server-name=$TLS_SERVER_NAME kubernetes" > /dev/null 2>&1
              K8S_ISSUER=$(retry kubectl get --raw /.well-known/openid-configuration | jq -r .issuer)
              K8S_CA=$(retry vault_kubectl "$VAULT_POD" -- cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
              vault_auth_write auth/kubernetes/config \
                  kubernetes_host="https://kubernetes.default.svc" \
                  kubernetes_ca_cert="$K8S_CA" \
                  issuer="$K8S_ISSUER"
              echo "  [Vault] Configuration complete!"
          env:
            - name: VAULT_NAMESPACE
              value: "vault"
            - name: VAULT_TLS_SERVER_NAME
              value: "vault"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
