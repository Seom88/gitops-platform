# Digest-pinned (fail-closed Trivy gate): refresh with
# skopeo inspect docker://docker.io/valkey/valkey:9.1.2-alpine | jq -r .Digest
# Tag stays for Renovate (docker datasource bumps tag+digest together).
image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11

ciliumNetworkPolicy:
  enabled: true

# Namespaces allowed to reach the cache on 6379. Add `nextcloud` when that
# Application lands. Zero-trust means this list is the entire ingress surface.
consumers:
  - immich

# longhorn-encrypted is the app volume class (longhorn-cnpg is databases only).
# Data is a rebuildable cache; the volume only avoids cold restarts.
persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn-encrypted

# Lean sizing per ADR-015: the cache holds thumbnails/metadata keys, not bulk data.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
