# Digest-pinned (fail-closed Trivy gate): refresh with
# skopeo inspect docker://docker.io/valkey/valkey:9.1.2-alpine | jq -r .Digest
# Tag stays for Renovate (docker datasource bumps tag+digest together).
image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

ciliumNetworkPolicy:
  enabled: true

# Namespaces allowed to reach the cache on 6379. immich uses redis db0
# (Bull queues); nextcloud uses dbindex 1 (config in apps/nextcloud/values.yaml).
# Zero-trust means this list is the entire ingress surface.
consumers:
  - immich
  - nextcloud

# longhorn-encrypted is the app volume class (longhorn-cnpg is databases only).
# Data is a rebuildable cache; the volume only avoids cold restarts.
persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn-encrypted

# Small requests because the cache holds thumbnails/metadata keys, not bulk data.
# Sizing is evidence-driven — ADR-015 (lean-by-watts) is deprecated since 2026-10-10.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
