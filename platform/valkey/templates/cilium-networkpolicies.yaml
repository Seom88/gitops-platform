{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for the shared Valkey cache — per-namespace zero-trust (ADR-014).
# Endpoint selector covers every pod in the namespace (Deployment valkey).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-allow-egress
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Valkey initiates no egress beyond DNS and apiserver health/status
    # lookups; this keeps the standard three-policy shape of ADR-014.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}
  ingress:
    # Consumer namespaces only (one entry per .Values.consumers). The cache is
    # internal-only: no Tailscale ingress, no world ingress, no other namespace.
    {{- range .Values.consumers }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . }}
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    {{- end }}
{{- end }}
