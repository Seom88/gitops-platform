developmentApp:
  enabled: false

# Configuration for the Loki subchart
loki:
  # Deployment mode: SingleBinary (simple), SimpleScalable (medium), Distributed (large)
  deploymentMode: SingleBinary

  # Number of replicas
  singleBinary:
    replicas: 1
    persistence:
      size: 2Gi  # chunks live on SeaweedFS S3; local PVC holds WAL only (measured ~10Mi, 2026-09-22)
      storageClass: ""
    # Inject SeaweedFS S3 credentials from Vault via ESO
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
    # Lean homelab sizing (prod): log volume fits the small request; the
    # limit caps query spikes without starving neighbors.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 800m
        memory: 1024Mi

  # Component replicas (set to 0 for Monolithic mode)
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  # Caching
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Helm test
  test:
    enabled: false

  # Loki application configuration
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Disable test schema to use our custom schemaConfig
    useTestSchema: false

    # Grafana Logs Drilldown requirements
    limits_config:
      volume_enabled: true
      discover_log_levels: true
      discover_service_name:
        - service_name
        - app
        - container
    pattern_ingester:
      enabled: true

  # Enable gateway (default is true, but we ensure it)
  gateway:
    enabled: true
    replicas: 1  # single-node: chart's hard podAntiAffinity prevents 2 replicas on same node
    # Lean sidecar: nginx gateway just reverse-proxies to singleBinary.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    service:
      port: 80
      type: ClusterIP

# Configuration for the Kube-Prometheus-Stack subchart
kube-prometheus-stack:
  # Control-plane scrapes: kube-scheduler and kube-controller-manager bind
  # ports that are unreachable from Prometheus in this cluster (up==0 with
  # 10s scrape timeouts sustained over the full sampler window, contributing
  # only up/scrape meta-series). Disabling their ServiceMonitors removes the
  # stalled scrape workers and error churn with zero usable-series loss; the
  # chart also gates their KubeSchedulerDown/KubeControllerManagerDown alerts
  # on these flags, so no absent-target alert fires.
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false

  # API-server cardinality diet: ~43% of TSDB head series come from the
  # apiserver job, ~23k of them verbose debug histogram buckets
  # (request-body/response-size/watch internals) consumed by no bundled rule
  # or dashboard. Dropping those families at scrape time cuts ~12% of
  # appended samples while keeping request_total, request_duration and the
  # SLI families that feed the burn-rate rules and API-server dashboard, so
  # alerting and latency visibility are unchanged.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "apiserver_(request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|watch_events_sizes)_(bucket|sum|count)"
          action: drop

  # Grafana configuration
  grafana:
    replicas: 2
    # Wave 2: this Deployment references the CNPG-generated
    # `grafana-database-app` Secret (DB set is wave -1, right after the
    # namespace at -2). Without this delay, Argo CD applies the Deployment
    # at wave 0 and fails with `secret "grafana-database-app" not found` —
    # same fix as the immich server Deployment (apps/immich/values.yaml).
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password

    # Per-app Ingress root — each app on its own device at / (no subpath)
    grafana.ini:
      server:
        domain: grafana.lonk-mirfak.ts.net
        root_url: https://grafana.lonk-mirfak.ts.net/
        serve_from_sub_path: false
      # Dashboard refresh floor 30s: global scrape stays 60s for energy,
      # per-target fast scrapes (e.g. ecoflow 15-30s) render smoothly here.
      dashboards:
        min_refresh_interval: 30s
      # Shared Postgres (CNPG grafana-database Cluster in this chart, wave
      # -1) so both replicas
      # share users/tokens/dashboards instead of per-pod SQLite (which caused
      # the 401 "user token not found" login loop). Non-secret parts live here;
      # the password comes from the CNPG-generated grafana-database-app Secret
      # via envValueFrom below — never in this ConfigMap-rendered ini.
      # Fresh DB on first sync: sqlite history is NOT migrated. Git-provisioned
      # dashboards/datasources reappear automatically; admin login still comes
      # from grafana-admin-credentials.
      database:
        path: /var/lib/grafana/grafana.db
        host: grafana-database-rw.monitoring.svc.cluster.local
        # REQUIRED: without type=postgres Grafana ignores host/port/name/user
        # and silently keeps per-pod SQLite (the original 401 bug).
        type: postgres
        port: 5432
        name: grafana
        user: grafana
        # Grafana default for postgres + CNPG accepts plaintext (immich
        # connects the same way with no TLS config).
        ssl_mode: disable
    # DB password from CNPG (Secret created by the Cluster at wave -1;
    # this Deployment is delayed to wave 2 via `annotations` above, so the
    # Secret exists before Argo CD applies it — no CreateContainerConfigError
    # loop on first install).
    envValueFrom:
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-database-app # pragma: allowlist secret
          key: password

    # Add Loki as a data source
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki-gateway.monitoring.svc.cluster.local/
        access: proxy
        # Even with auth_enabled: false, Loki requires an org ID header
        # This is a known quirk - the value can be anything since auth is disabled
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "fake"

    # Trivy Operator community dashboard (templates/dashboards/) carries
    # annotation grafana_folder=Trivy; the sidecar only honors it when
    # folderAnnotation is set (upstream default null drops it in General).
    sidecar:
      dashboards:
        folderAnnotation: grafana_folder

    # Lean homelab sizing (prod): dashboard rendering bursts fit the small
    # request; idle is near zero. Memory limit raised to 1Gi after observing
    # 706Mi live usage against the old 768Mi cap (92% — OOM risk).
    resources:
      requests:
        cpu: 80m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    livenessProbe:
      initialDelaySeconds: 90
    readinessProbe:
      initialDelaySeconds: 20
      timeoutSeconds: 5

    # Native Ingress configuration for Grafana
    ingress:
      enabled: false
      ingressClassName: tailscale
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      hosts:
        - grafana
      tls:
        - hosts:
            - grafana

  # Prometheus persistent storage & native Ingress:
  # Right-sized for 3x4cpu/6GB workers (prod): 5d/10GB retention keeps the
  # TSDB working set small while leaving headroom for immich, nextcloud
  # and cloud pg. PVC 12Gi holds retentionSize 10GB + WAL headroom
  # (measured steady state ~1Gi, 2026-09-22).
  prometheus:
    prometheusSpec:
      scrapeInterval: "60s"
      evaluationInterval: "60s"
      retention: 5d
      retentionSize: 10GB
      # Root-served per-app Ingress (moved from platform/ts-ingress, ADR-018)
      externalUrl: https://prometheus.lonk-mirfak.ts.net/
      # Lean homelab sizing (prod): 60s scrapes keep TSDB steady state small;
      # measured with zero throttling (memory, retention untouched).
      resources:
        requests:
          cpu: 150m
          memory: 512Mi
        limits:
          cpu: 800m
          memory: 2048Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            # Kept as-is: Longhorn default class (created by Longhorn itself,
            # not defined in this repo). If write load ever justifies it,
            # consider a replica-1 StorageClass for Prometheus TSDB data
            # (metrics are reproducible from exporters; Loki chunks already
            # live on S3). Do NOT rename blindly — verify class exists first.
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 12Gi

    # Native Ingress configuration for Prometheus
    ingress:
      enabled: false
      ingressClassName: tailscale
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      hosts:
        - prometheus
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - prometheus
    # Chart-native selector for the Prometheus pods. The upstream knob exposes
    # no ingress/egress rule fields, so this renders an empty policy and every
    # effective allow stays in the Cilium overlay; enabled for knob parity
    # across the stack. No egress key exists upstream, so none is set here.
    networkPolicy:
      enabled: true

  # Alertmanager configuration:
  alertmanager:
    alertmanagerSpec:
      replicas: 2
      # Lean: alertmanager is idle except on firing alerts.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    # Chart-native ingress allows: Prometheus scrapes (9093) and the
    # config-reloader sidecar (8080) reach Alertmanager without custom rules.
    # Egress stays disabled so the Cilium overlay remains the sole egress authority.
    networkPolicy:
      enabled: true
      egress:
        enabled: false

  # Prometheus Operator: admission webhook + config reconciliation only.
  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Chart-native allows for the operator pod: ingress on 10250
    # (TLS webhook/metrics) plus unrestricted egress. Both only widen the
    # Cilium overlay allowlist (union semantics); the chart defines no egress
    # restriction, so no new denial is introduced.
    networkPolicy:
      enabled: true

  # kube-state-metrics: small in-memory metrics cache.
  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # node-exporter (DaemonSet, per node): host metrics only.
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Grafana Alloy — log shipper for Loki
# Deployed as a DaemonSet: discovers local pods via discovery.kubernetes, filters to own node,
# tails /var/log/pods host mount via loki.source.kubernetes, and forwards to Loki gateway.
ciliumNetworkPolicy:
  enabled: true

alloy:
  alloy:
    mounts:
      varlog: true
    # Lean homelab sizing (prod): per-node tail volume is small; minimal
    # request keeps the DaemonSet schedulable.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        // 1. Discover only the pods on this node (filtered server-side)
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        // 2. Relabel: same labels as before + __path__ for file tailing
        discovery.relabel "local_pods" {
          targets = discovery.kubernetes.pods.targets

          // NEW: path of the container log file on the node
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        // 3. Resolve the glob paths into actual files
        local.file_match "pod_logs" {
          path_targets = discovery.relabel.local_pods.output
        }

        // 4. Tail the files from disk (no apiserver involved)
        loki.source.file "pods" {
          targets    = local.file_match.pod_logs.targets
          forward_to = [loki.process.drop_noise.receiver]
        }

        // 5. Parse CRI format, then drop probe noise
        loki.process "drop_noise" {
          forward_to = [loki.write.grafana_loki.receiver]

          stage.cri {}

          stage.drop {
            expression          = ".*(kube-probe|healthz|livez|readyz).*"
            drop_counter_reason = "healthcheck_noise"
          }
        }

        // 6. Send logs to Loki Gateway
        loki.write "grafana_loki" {
          endpoint {
            url = "http://monitoring-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "fake",
            }
          }
        }
  controller:
    type: daemonset

# See ADR 017
vault:
  enabled: false

# Per-app Tailscale Ingresses (moved from platform/ts-ingress, ADR-018)
tailscaleIngress:
  grafana:
    enabled: true
    hostname: grafana
  prometheus:
    enabled: true
    hostname: prometheus

# Shared CNPG Postgres for Grafana (2 replicas, one DB — fixes the 401
# sqlite-per-pod split). Cluster + backups live in this chart (operator is
# wave -1, so the CRD exists before this wave-3 app syncs). Templates:
# grafana-database-*.yaml. Mirrors the apps/immich backup pattern.
# Shares ciliumNetworkPolicy.enabled / developmentApp.enabled above.
backup:
  enabled: true
  endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
  region: us-east-1
  bucket: grafana-db-backups
  iamUser: grafana-backup
  secretName: grafana-backup-s3-credentials # pragma: allowlist secret
  # 04:00 UTC daily, matching Longhorn default-daily-backup (retain 3).
  schedule: "0 4 * * *"
  # Recovery-window retention. The plugin CRD only accepts `<n>[dwm]`, so the
  # "3 backup points" policy is expressed as 3d (one backup/day ≈ 3 points).
  retentionPolicy: "3d"

# Naming contract for the cnpg-seaweedfs-backup library chart
# (charts/cnpg-seaweedfs-backup). namespace is explicit here because the
# repo convention (namespace == app slug) does not hold: the cluster lives
# in `monitoring`, not `grafana`.
cnpgBackup:
  app: grafana
  cluster: grafana-database
  namespace: monitoring
  # Negative waves: the whole DB set (RBAC, backup-init hook, ObjectStore,
  # ScheduledBackup) applies at -1, right after the namespace (-2) and well
  # before the Grafana Deployment (wave 2) that needs the CNPG secret.
  # Same-wave races self-heal (operator retry / kubelet retry).
  waves:
    rbac: "-1"
    hook: "-1"
    resources: "-1"

# Single-node: 1 instance. Grafana HA comes from 2 stateless-ish pods
# sharing this DB, not from Postgres replicas.
cnpg:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 2Gi
