developmentApp:
  enabled: true

# Loki S3 endpoint — unified service name (no -dev suffix after ADR-012 simplification)
loki:
  singleBinary:
    # Dev sizing: full requests/limits for rich query metrics and to catch
    # pressure in dev before prod.
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1024Mi }
  loki:
    storage:
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc:8333

# Configuration for the Kube-Prometheus-Stack subchart — dev single-node tuning (16GB host, 6GB VM)
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      externalUrl: https://prometheus-dev.lonk-mirfak.ts.net/
      retention: 2d
      retentionSize: 5GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { cpu: 1000m, memory: 1Gi }
  alertmanager:
    alertmanagerSpec:
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 100m, memory: 128Mi }
  grafana:
    grafana.ini:
      server:
        domain: grafana-dev.lonk-mirfak.ts.net
        root_url: https://grafana-dev.lonk-mirfak.ts.net/
    # Dev sizing: full requests/limits so dashboard bursts and TSDB load
    # surface real metrics in dev before prod.
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
    persistence: { enabled: false }

# Dev sizing: full per-node floor so log tail fan-out is never starved
# while testing; prod stays lean.
alloy:
  alloy:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }

# See ADR 017
vault:
  enabled: false

tailscaleIngress:
  grafana:
    hostname: grafana-dev
  prometheus:
    hostname: prometheus-dev

# Dev backup identity: separate bucket/user/secret so dev and prod never share
# a backup store or credentials. Schedule/retention mirror prod.
backup:
  bucket: grafana-db-backups-dev
  iamUser: grafana-backup-dev
  secretName: grafana-backup-s3-credentials-dev # pragma: allowlist secret (name reference, not a value)
