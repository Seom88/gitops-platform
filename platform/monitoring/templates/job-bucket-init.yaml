{{- if .Values.loki.loki.storage.bucketNames }}
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-bucket-init
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook-weight: "-1"
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-bucket-init
        app.kubernetes.io/component: bucket-init
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      dnsPolicy: ClusterFirst
      containers:
        - name: bucket-init
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked (regex manager
          # covers platform/*/templates). Refresh:
          # skopeo inspect docker://amazon/aws-cli:<tag> | jq -r .Digest
          image: amazon/aws-cli:2.37.4@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loki-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[bucket-init] Starting Loki bucket init (SeaweedFS)..."
              # Wait for credentials injected as env vars from Secret loki-s3-credentials
              # (ExternalSecret wave -1 from Vault secret/seaweedfs/s3). Secret uses
              # optional:true so Job can be created before ESO syncs; we poll 60s.
              WAIT_SECS=0
              WAIT_MAX=60
              while [ $WAIT_SECS -lt $WAIT_MAX ]; do
                if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
                  echo "[bucket-init] Credentials available."
                  break
                fi
                echo "[bucket-init] Waiting for credentials env AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY ($WAIT_SECS/$WAIT_MAX s)..."
                sleep 5
                WAIT_SECS=$((WAIT_SECS + 5))
              done
              if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
                echo "[bucket-init] ERROR: credentials not available after $WAIT_MAX s (Secret loki-s3-credentials missing?)"
                echo "[bucket-init] Hint: ensure ExternalSecret loki-s3-credentials (wave -1) synced from Vault secret/seaweedfs/s3."
                exit 1
              fi
              export AWS_DEFAULT_REGION="{{ .Values.loki.loki.storage.s3.region | default "us-east-1" }}"
              export AWS_EC2_METADATA_DISABLED="true"
              export AWS_S3_ADDRESSING_STYLE="path"
              # Ensure aws-cli uses path-style addressing (SeaweedFS S3 requires it)
              aws configure set default.s3.addressing_style path || true
              aws configure set default.s3.addressing_style path --profile default || true
              ENDPOINT="{{ .Values.loki.loki.storage.s3.endpoint | default "http://seaweedfs-s3.seaweedfs.svc:8333" }}"
              # Buckets templatable with hardcode fallback; extend list for future admin bucket
              BUCKETS="{{ .Values.loki.loki.storage.bucketNames.chunks | default "loki-chunks" }} {{ .Values.loki.loki.storage.bucketNames.ruler | default "loki-ruler" }}"
              echo "[bucket-init] Endpoint: $ENDPOINT (region $AWS_DEFAULT_REGION)"
              echo "[bucket-init] Buckets: $BUCKETS"
              # Wait for SeaweedFS S3 ClusterIP DNS to be ready
              echo "[bucket-init] Waiting for seaweedfs-s3.seaweedfs.svc (max 120s)..."
              DNS_WAIT=0
              DNS_MAX=120
              while [ $DNS_WAIT -lt $DNS_MAX ]; do
                if nslookup seaweedfs-s3.seaweedfs.svc >/dev/null 2>&1 || getent hosts seaweedfs-s3.seaweedfs.svc >/dev/null 2>&1; then
                  echo "[bucket-init] DNS resolved for seaweedfs-s3.seaweedfs.svc"
                  break
                fi
                echo "[bucket-init] DNS not yet resolved ($DNS_WAIT/$DNS_MAX s)..."
                sleep 5
                DNS_WAIT=$((DNS_WAIT + 5))
              done
              if [ $DNS_WAIT -ge $DNS_MAX ]; then
                echo "[bucket-init] WARNING: DNS still not resolved after $DNS_MAX s — proceeding anyway (may fail, Argo will retry)"
              fi

              for BUCKET in $BUCKETS; do
                echo "[bucket-init] Creating bucket $BUCKET at $ENDPOINT (region $AWS_DEFAULT_REGION)..."
                set +e
                OUTPUT="$(aws s3api create-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" 2>&1)"
                RC=$?
                set -e
                echo "$OUTPUT"
                if [ $RC -eq 0 ]; then
                  echo "[bucket-init] Bucket $BUCKET created successfully."
                else
                  if echo "$OUTPUT" | grep -qiE 'BucketAlreadyOwnedByYou|BucketAlreadyExists|already exists'; then
                    echo "[bucket-init] Bucket $BUCKET already exists — continuing (idempotent)."
                  else
                    echo "[bucket-init] ERROR: create-bucket $BUCKET failed with exit $RC"
                    exit $RC
                  fi
                fi
                echo "[bucket-init] Verifying bucket $BUCKET with head-bucket..."
                aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"
                echo "[bucket-init] Verification OK — bucket $BUCKET is accessible."
                aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION" || true
              done
              echo "[bucket-init] Done — all Loki buckets ready."
{{- end }}
