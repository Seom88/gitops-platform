{{- if .Values.loki.loki.storage.bucketNames }}
{{- $bucket := .Values.loki.loki.storage.bucketNames.chunks | default "loki" }}
{{- $region := .Values.loki.loki.storage.s3.region | default "us-east-1" }}
{{- $endpoint := .Values.loki.loki.storage.s3.endpoint | default "" }}
{{- $fqdn := $endpoint | trimPrefix "https://" | trimPrefix "http://" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-bucket-init
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook-weight: "-1"
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-bucket-init
        app.kubernetes.io/component: bucket-init
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      dnsPolicy: ClusterFirst
      containers:
        - name: bucket-init
          # Digest-pinned (fail-closed Trivy gate); Renovate-tracked (regex manager
          # covers platform/*/templates). Refresh:
          # skopeo inspect docker://amazon/aws-cli:<tag> | jq -r .Digest
          image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "s3-bucket-lib.bucketInitScript" (dict "fqdn" $fqdn "region" $region "bucket" $bucket "tag" "loki-bucket-init" "credFile" "/etc/monitoring/cloud") | nindent 14 }}
          volumeMounts:
            - name: loki-s3-credentials # pragma: allowlist secret
              mountPath: /etc/monitoring
              readOnly: true
      volumes:
        - name: loki-s3-credentials # pragma: allowlist secret
          secret:
            secretName: loki-s3-credentials # pragma: allowlist secret
            optional: true
            items:
              - key: cloud
                path: cloud
{{- end }}