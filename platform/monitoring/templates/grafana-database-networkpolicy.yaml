{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicy for the grafana-database CNPG cluster (namespace monitoring).
# Additive to this chart's other policies (DNS egress already covers these
# pods via monitoring-allow-dns). Covers: Grafana -> postgres 5432 (ingress
# on the DB pods + egress on the Grafana pods, because monitoring-allow-egress
# selects every pod in the namespace and has no 5432), CNPG operator
# reconciliation 5432+8000, Prometheus scraping 9187+8000.
# Pod ports only (post-DNAT). Kubelet probes need no rule (immich precedent).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-database-allow-ingress
  namespace: monitoring
  annotations:
    # Wave -1 with the rest of the DB set (Cluster, store, hook): the policy
    # must exist before the CNPG pods start talking.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grafana-database
  ingress:
    # Grafana pods -> postgres 5432 (shared DB for both replicas)
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: grafana
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # CNPG operator reconciliation (lives in cnpg-system) -> postgres 5432 + metrics 8000
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Intra-cluster streaming replication: replica -> primary 5432.
    # Without this, scaling past 1 instance hangs the join pod with
    # dial tcp ...:5432 i/o timeout (Cilium drop, not Postgres auth).
    - fromEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: grafana-database
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Prometheus scraping from monitoring -> CNPG metrics 8000/9187
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
---
# Egress side of Grafana -> postgres. Required because monitoring-allow-egress
# selects all pods in the namespace (endpointSelector: {}) and allows no 5432:
# without this, Grafana SYNs are dropped and the container crashloops after the
# 30s migration-transaction timeout with zero attempts in the postgres logs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-allow-db-egress
  namespace: monitoring
  annotations:
    # Same wave as the ingress twin above: must exist before Grafana connects.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    # Grafana pods -> postgres 5432 on the grafana-database pods
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: grafana-database
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Egress twin of the replication rule above. monitoring-allow-egress selects
# every pod in the namespace but carries no 5432, so without this the
# replica's SYNs never leave the pod (same i/o timeout symptom).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-database-intra-egress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grafana-database
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: grafana-database
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# CNPG backup data plane -> RustFS S3 (shared bucket cnpg-db-backups).
# Same FQDN:443 pattern as Velero (RustFS needs SNI = LE-cert FQDN).
{{- if .Values.backup.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-backup-to-rustfs-s3
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grafana-database
  egress:
    - toFQDNs:
        - matchName: rustfs.lonk-mirfak.ts.net
        - matchPattern: "*.lonk-mirfak.ts.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*.ts.net"
              - matchPattern: "*.lonk-mirfak.ts.net"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
