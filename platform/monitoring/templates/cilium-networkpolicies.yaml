{{- if .Values.ciliumNetworkPolicy.enabled }}
# CiliumNetworkPolicies for monitoring namespace — portfolio-grade default-deny with scoped allowlists
# Covers: Alloy DaemonSet -> kube-api + Loki gateway + DNS, Prometheus scraping, Grafana ingress, Loki -> RustFS S3, Hubble

# 1) DNS egress — allow all pods in monitoring to resolve via kube-dns (Cilium DNS-aware)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-dns
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# 2) Egress allowlist — kube-apiserver, intra-monitoring, RustFS S3, Hubble, and cluster scraping
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-egress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    # Alloy & prometheus-operator need kube-apiserver (discovery, ServiceMonitors)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Intra-monitoring: alloy -> loki 3100, prometheus 9090, grafana 3000, alertmanager 9093
    # Pod ports only: 80->3000/3100 post-DNAT; 80 never matches
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9094"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    # Loki -> RustFS S3 (443) — bucketNames loki (chunks + ruler share one bucket)
    # Velero pattern: FQDN:443 L4 only + toCIDR tailnetIp/32 as FQDN-independent
    # fallback (Cilium only learns FQDN->IP by observing DNS).
    - toFQDNs:
        - matchName: rustfs.lonk-mirfak.ts.net
        - matchPattern: "*.lonk-mirfak.ts.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - {{ required "backup.tailnetIp is required (set backup.tailnetIp in platform/monitoring values.yaml)" .Values.backup.tailnetIp }}/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Prometheus scraping: allow egress to any pod in cluster on scrape ports (9100 node-exporter, 8080 kube-state-metrics, 9090, 9153 coredns, 10250 kubelet, 9187 CNPG metrics)
    # Uses toEntities cluster to avoid enumerating every namespace/selector — Hubble will show flows per-identity
    # Cilium metrics (9962 agent, 9963 operator, 9964 envoy, 9965 hubble, 9966 relay)
    # Immich server metrics (8081 metrics-api, 8082 metrics-ms)
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "9187"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9153"
              protocol: TCP
            - port: "10250"
              protocol: TCP
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP
            - port: "9327"
              protocol: TCP
            - port: "8085"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "9966"
              protocol: TCP
    # Grafana plugins - grafana.com:443 for GF_INSTALL_PLUGINS
    - toFQDNs:
        - matchName: grafana.com
        - matchPattern: "*.grafana.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            dns:
              - matchPattern: grafana.com
              - matchPattern: "*.grafana.com"
              - matchPattern: "*.grafana.org"
    # Hubble relay (optional observability)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
# 3) Ingress allowlist — intra-monitoring + scrape from Prometheus + Tailscale gateway to Grafana, plus Hubble
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-ingress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  ingress:
    # Intra-monitoring (prometheus, alloy, loki, grafana talk among themselves) — narrowed to 3100,9090,9093,9094,3000,8080 (loki 3100, prom 9090, alertmanager 9093/9094, grafana 3000, kube-state-metrics 8080)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9094"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Allow scraping from prometheus pods anywhere in cluster (node-exporter, kube-state-metrics, loki, coredns)
    # Prometheus lives in monitoring, but Cilium identity is cluster-scoped — use cluster entity for health checks
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9153"
              protocol: TCP
            - port: "10250"
              protocol: TCP
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP
    # Grafana 3000 + Prometheus 9090 via per-app Tailscale proxies (ADR-018) — Pod ports only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            k8s:tailscale.com/managed: "true"
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # Cilium health/probe — narrowed to scrape + probe ports 8080,9090,9100,9153,3100,7946,8084,3000 (fixes 8084 connection refused on probes) — no longer allow-all
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9153"
              protocol: TCP
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP
            - port: "8084"
              protocol: TCP
            - port: "3000"
              protocol: TCP
{{- end }}
