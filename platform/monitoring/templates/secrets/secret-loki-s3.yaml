{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Static S3 keys — rotate by hand, so a 5m re-read is plenty and keeps
  # 1m Vault/API churn off the ESO controller and Vault followers.
  refreshInterval: 5m
  secretStoreRef:
    name: vault-loki-s3
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "secret/loki/s3"
        property: "admin_access_key"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "secret/loki/s3"
        property: "admin_secret_key"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
