{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Static Grafana admin password — rotates by hand, so a 5m re-read is
  # plenty and keeps 1m Vault/API churn off the ESO controller.
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-monitoring
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: admin-password # pragma: allowlist secret
    remoteRef:
      key: "grafana/admin"
      property: "password"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: admin-user # pragma: allowlist secret
    remoteRef:
      key: "grafana/admin"
      property: "user"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
