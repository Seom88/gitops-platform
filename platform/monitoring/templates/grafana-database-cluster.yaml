# Shared Postgres for Grafana (wave -1 with the DB set, before the Grafana
# Deployment at wave 2 that consumes the CNPG-generated grafana-database-app
# Secret). Direct manifests — no library chart. Backup model: shared bucket
# `cnpg-db-backups` + key `cnpg-backup` (manual, see docs/rustfs-iam.md),
# per-DB prefix `grafana/`. No extensions, no Database CR: Grafana uses plain tables.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- if .Values.recovery.enabled }}
    # Required only while `recovery.enabled` is true. CNPG refuses to bootstrap a
    # cluster whose WAL archive is not empty ("Expected empty archive") — a check
    # that exists to stop one cluster from clobbering another's archive. We are
    # deliberately restoring into the SAME archive this cluster already owns, and
    # we keep `plugins` below so archiving resumes on the recovered cluster
    # (upstream explicitly supports plugins on a recovered cluster). The
    # annotation value must be the literal string `enabled`, not `"true"`.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
    {{- end }}
spec:
  monitoring:
    enablePodMonitor: true
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName }}
  {{- if .Values.backup.enabled }}
  # NOTE: deliberately NOT gated on `.Values.recovery.enabled`. Gating it that way
  # (as this template did until 2026-10-08) silently dropped `.spec.plugins` the
  # moment recovery was turned on, which is the whole outage: every ScheduledBackup
  # then fails with "cannot proceed with the backup as the cluster has no plugin
  # configured", WAL archiving stops, and the archive silently goes stale while
  # base backups keep reporting success. Barman is the ONLY recovery layer here
  # (Velero carries no DB bytes), so losing the plugin means losing the fallback.
  # Upstream docs bless plugins on a recovered cluster so archiving resumes
  # immediately after recovery.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: grafana-backup-store
  {{- end }}
  bootstrap:
    {{- if .Values.recovery.enabled }}
    recovery:
      source: {{ .Values.recovery.source }}
      {{- if .Values.recovery.targetTime }}
      recoveryTarget:
        targetTime: {{ .Values.recovery.targetTime | quote }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
    {{- end }}
  {{- if .Values.recovery.enabled }}
  externalClusters:
    - name: {{ .Values.recovery.source }}
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: grafana-backup-store
          serverName: {{ .Values.recovery.serverName }}
  {{- end }}
  {{- with .Values.cnpg.postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    {{- if .Values.cnpg.storage.class }}
    storageClass: {{ .Values.cnpg.storage.class }}
    {{- end }}
    size: {{ .Values.cnpg.storage.size }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: grafana-database-mirror
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    release: monitoring
    app.kubernetes.io/name: grafana-database
    app.kubernetes.io/part-of: monitoring
spec:
  jobLabel: cnpg.io/cluster
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      cnpg.io/cluster: grafana-database
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      scheme: http
      interval: 60s
      scrapeTimeout: 10s

{{- if .Values.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: grafana-backup-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  configuration:
    destinationPath: s3://{{ .Values.backup.bucket }}/{{ .Values.backup.prefix }}/
    endpointURL: {{ .Values.backup.endpoint }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.secretName }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.backup.secretName }}
        key: SECRET_ACCESS_KEY
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-database-daily
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: grafana-database
  schedule: {{ .Values.backup.schedule | quote }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
