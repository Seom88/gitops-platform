# Kepler power monitor Grafana dashboard (official, Apache-2.0)
# Source: https://github.com/sustainable-computing-io/kepler-operator
# (hack/dashboard/assets/kepler/dashboard.json, uid 381ef848...) with one local
# deviation: every power panel derives watts from Kepler's cumulative joule
# counters, rate(kepler_*_joules_total[5m]), instead of the kepler_*_watts
# gauges. That covers the time series ("Total Power Consumption (W) per Zone",
# "Node Power Consumption (W) By Zone", node active/idle), the pod and namespace
# charts, and the "Average ... (selected range)" tables, which average the 5m
# rate over $__range with a subquery.
# Why: kepler_node_cpu_watts is a short-window estimate. On aleph it is unbiased
# (its median matches the 60s counter delta) but noisy per sample: 7% of minutes
# exceed that delta by >25% and single minutes reach 2.1x, which a 1m-refresh
# panel paints as fake 10-20W spikes. The counter derivative is the same average
# power without that per-sample variance; real bursts (the 18:00 UTC Velero
# backup, ~17.5W) still show. kepler_node_cpu_watts survives only in the
# "RAPL Info" table, which keeps labels and discards the values.
# Uses the ${datasource} variable (type prometheus), which resolves
# to this stack's datasource uid "prometheus" — no substitutions needed.
# Picked up by the Grafana sidecar (label grafana_dashboard=1, searchNamespace
# ALL) and placed in the "Kepler" folder via kube-prometheus-stack.grafana.
# sidecar.dashboards.folderAnnotation.
# Requires kepler_* series: ServiceMonitor from platform/kepler
# (label release=monitoring) and the Cilium policy allowing monitoring ->
# kepler:28282 ingress.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-power-monitor-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Kepler"
data:
  kepler-power-monitor.json: |-
{{ .Files.Get "dashboards/kepler-power-monitor.json" | nindent 4 }}
