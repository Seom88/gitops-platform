{{- if not (eq (index .Values "kube-prometheus-stack" "enabled") false) }}
# Kepler ServiceMonitor managed by monitoring chart (same pattern as
# templates/services/velero-servicemonitor.yaml).
# Decoupled from platform/kepler/values.yaml where the vendored subchart's
# serviceMonitor.enabled is now false.
# Replicates sustainable_computing_io/kepler 0.12.0 template exactly
# (kepler/templates/servicemonitor.yaml):
# - Service name/port: kepler (28282), port name http — matches /kepler svc
# - Selector: app.kubernetes.io/name=kepler, app.kubernetes.io/instance=kepler
# - Namespace: kepler (the vendored chart renders the SM there too)
# - Interval 60s (RAPL energy counters are cumulative; 30s is plenty and the
#   5s chart default induces power computations)
# - scrapeTimeout 30s: the vendored template cannot set it (no knob), so the
#   endpoint inherits Prometheus' global default of 10s. Kepler collection
#   runs 8.6s (p50) to 10.0s (p95) on aleph, so ~31% of scrapes hit the
#   10s ceiling exactly (operator docs: "If empty, Prometheus uses the
#   global scrape timeout"; Prometheus docs: "default = 10s") and produce
#   1-2 min gaps in dashboards. 30s stays below the 60s interval, the upper
#   bound the operator rejects ("The value cannot be greater than the scrape
#   interval").
# - metricRelabelings drop the target's own pod/namespace labels. Prometheus
#   attaches them to EVERY series of this scrape, so without this every
#   kepler_container_* series claims to belong to pod kepler-<hash> in
#   namespace kepler. Kepler's real attribution lives elsewhere:
#   pod_name/pod_namespace on kepler_pod_*, and pod_id/container_name on
#   kepler_container_*. Dropping the false labels keeps `kubectl`-style
#   grouping from silently returning the exporter itself.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler
  namespace: kepler
  labels:
    app.kubernetes.io/name: kepler
    app.kubernetes.io/instance: kepler
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kepler-0.12.0
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kepler
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
      app.kubernetes.io/instance: kepler
  endpoints:
    - port: http
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
      metricRelabelings:
        - action: labeldrop
          regex: pod|namespace
{{- end }}
