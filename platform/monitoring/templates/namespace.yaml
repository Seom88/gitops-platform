apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    # Wave -2: first resource in this app. Everything else (secrets, DB,
    # hooks, workloads at -1 and above) needs the namespace to exist.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
