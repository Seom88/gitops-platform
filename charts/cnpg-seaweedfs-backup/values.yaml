# Default contract for the cnpg-seaweedfs-backup library chart.
# A consuming app sets `backup` (store identity) + `cnpgBackup` (naming) in its
# own values and adds three thin wrappers, e.g. apps/immich/templates/pg-backup.yaml:
#
#   {{- if .Values.backup.enabled }}
#   {{- include "cnpg-backup.store" $ }}
#   {{- end }}
#
# plus the rbac/job/cilium wrappers (see templates/*.tpl headers).
# With app=immich, cluster=immich-database the render matches the pre-library
# manifests object for object — that is the migration acceptance test.
cnpgBackup:
  # Short app slug. Derives: <app>-backup-init (Job/SA/Role/Binding),
  # <app>-backup-store (ObjectStore), <app>-backup-init-provisioner (seaweedfs RBAC).
  app: ""
  # CNPG Cluster name. Derives ScheduledBackup <cluster>-daily. The Cluster's
  # own plugin block must reference barmanObjectName: <app>-backup-store
  # (or cnpgBackup.storeName when overridden).
  cluster: ""
  # ObjectStore name override. Default: <app>-backup-store.
  storeName: ""
  # Target namespace for namespaced backup objects (Cilium egress policies).
  # Default follows the repo convention namespace == app slug.
  namespace: ""
  # backup-init container image (digest-pinned; Renovate regex manager covers charts/*/templates).
  image: "amazon/aws-cli:2.37.0@sha256:337494c2047176fe9abcf45a5d1eaf1c2c62cae40953284fb1143b5c6170f065"
  imagePullPolicy: IfNotPresent
  # Hook runtime bounds. Defaults mirror the proven immich settings.
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  # Static SeaweedFS admin identity used for provisioning only (never for backups).
  seaweedfs:
    namespace: seaweedfs
    secretName: seaweedfs-s3-credentials # pragma: allowlist secret (name reference, not a value)
    # S3 data-plane endpoint matched by the Cilium egress snippet.
    s3Port: 8333
    s3Component: s3
  # Argo CD local sync waves. RBAC (-1) < hook (0) < Cluster/ObjectStore/ScheduledBackup (1).
  waves:
    rbac: "-1"
    hook: "0"
    resources: "1"
