# App-of-Apps chart values — ordered core is plain Applications in templates/apps/ (see ADR-006)
repoURL: https://github.com/Seom88/secured-gitops-tailscale-homelab.git
platformApps:
  enabled: true

# Shared S3 endpoint — single source: this literal (GitOps-pure).
# ArgoCD repo-server renders path gitops ONLY from git, so a `--set`
# side-channel never reaches it on re-render. The platform charts carry
# NO fallback literal (s3.tailnetFqdn is "" + `required`): if this URL
# changes, the old one points to no RustFS — fail loudly, never silently.
# is an independent source — if the RustFS host ever changes, update both.
sharedS3:
  tailnetFqdn: "rustfs.lonk-mirfak.ts.net"

developmentApp:
  enabled: false

vault:
  enabled: false

eso:
  enabled: false
