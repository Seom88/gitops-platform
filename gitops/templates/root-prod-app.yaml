apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: gitops:argoproj.io/Application:argocd/gitops
    # Self-reference must sync LAST: parent aggregates children health,
    # otherwise any wave waits for gitops Healthy
    # that can never happen until children sync (ADR-006/008 loop).
    argocd.argoproj.io/sync-wave: "100"
  name: gitops{{- if .Values.developmentApp.enabled }}-dev{{- end }}
  namespace: argocd
  labels:
    wave-policy: sync-only
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ if .Values.developmentApp.enabled }}dev{{ else }}main{{ end }}
    path: gitops
    helm:
      valueFiles:
        - values.yaml
        {{- if .Values.developmentApp.enabled }}
        - values-dev.yaml
        {{- end }}
      # Propagate the FQDN into Argo's own render of this chart.
      # repo-server renders path gitops from git (the literal in values.yaml
      # is the single source) using ONLY this Application's spec — helm
      # release --set values never reach it. Without this, `required` in
      # 00-velero.yaml fails every root sync. A --set sharedS3.tailnetFqdn
      # at install time acts only as an override of the git literal.
      parameters:
        - name: sharedS3.tailnetFqdn
          value: {{ required "sharedS3.tailnetFqdn is required (set gitops/values.yaml)" .Values.sharedS3.tailnetFqdn | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
