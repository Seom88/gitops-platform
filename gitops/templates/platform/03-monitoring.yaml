{{- if .Values.platformApps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/tracking-id: gitops:argoproj.io/Application:argocd/monitoring
  labels:
    wave-policy: sync-only
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ if .Values.developmentApp.enabled }}dev{{ else }}main{{ end }}
    path: platform/monitoring
    helm:
      ignoreMissingValueFiles: true
      valueFiles:
        - values.yaml
        {{- if .Values.developmentApp.enabled }}
        - values-dev.yaml
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # CNPG's `.spec.bootstrap` is WRITE-ONCE. This cluster was bootstrapped by a
  # PITR, so `recoveryTarget` stays on the live object forever, and server-side
  # apply cannot remove it (no field manager owns it). Left unreconciled, the
  # application is pinned OutOfSync on an inert field forever.
  #
  # Scoped to this exact group/kind/name AND this exact path, so it cannot mask
  # drift anywhere else: every other field of every other resource is still
  # compared.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: grafana-database
      jqPathExpressions:
        - .spec.bootstrap.recovery
        # The operator stamps this annotation on every config reload; git
        # never renders it, so without this the Cluster is permanently
        # OutOfSync. Scoped to this one annotation only.
        - .metadata.annotations."cnpg.io/reloadedAt"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Retry=true
{{- end }}
