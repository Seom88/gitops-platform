  tailnetFqdn: "rustfs.lonk-mirfak.ts.net"
  # Same tailnet IP as prod (dev BSL points at the PROD prefix for restore drills).
  tailnetIp: "100.89.39.31"

developmentApp:
  enabled: true

vault:
  enabled: false

eso:
  enabled: false
